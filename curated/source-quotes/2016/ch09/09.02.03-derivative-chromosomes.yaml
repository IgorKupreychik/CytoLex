version: "2016"
section: "9.2.3"
quotes:
  - rule: REC.NOT_ACQUIRED
    cite: {section: "9.2.3", page: 60, para: "¶2"}
    text: >-
      A recombinant chromosome (rec) is a structurally rearranged chromosome with a new segmental
      composition resulting from meiotic crossing-over; consequently, this term should not be
      used in the description of acquired chromosome abnormalities.
  - rule: DER.NO_PH_SYMBOL
    cite: {section: "9.2.3", page: 62, para: "¶6"}
    text: >-
      The term Philadelphia chromosome is for historical reasons retained to describe the
      derivative chromosome 22 generated by the translocation t(9;22)(q34;q11.2). The abbreviation
      Ph (formerly Ph^1) may be used in text, but not in the description of the karyotype, where
      der(22) t(9;22)(q34;q11.2) is recommended. Similarly, the derivative chromosome 9 resulting
      from the t(9;22) is designated der(9)t(9;22)(q34;q11.2).
  - rule: DER.INSERTION_POINT_CONVENTION
    cite: {section: "9.2.3", page: 63, example: E18}
    text: >-
      In such situations, when there are two breakpoints in the recipient chromosome, the
      proximal one is listed as the point of insertion.
  - rule: DER.INSERTION_POINT_CONVENTION
    cite: {section: "9.2.3", page: 63, example: E19}
    text: >-
      By convention, the breakpoint in the derivative chromosome is specified as the point of
      insertion of the unknown material.
  - rule: DER.ISODERIVATIVE
    cite: {section: "9.2.3", page: 63, para: "¶8"}
    text: >-
      An isoderivative chromosome, abbreviated ider, designates an isochromosome formation for one
      of the arms of a derivative chromosome. The breakpoints are assigned to the centromeric
      bands p10 and q10 according to the morphology of the isoderivative chromosome (see Section
      9.2.11).
  - rule: DER.DICENTRIC_FORMAT
    cite: {section: "9.2.3", page: 63, para: "¶9"}
    text: >-
      When a derivative chromosome is dicentric and contains one or more additional abnormalities,
      the two centromere-containing chromosomes are given within parentheses, separated by a
      semicolon, followed by the specification of the aberrations.
  - rule: DER.DICENTRIC_FORMAT
    cite: {section: "9.2.4", page: 66, para: "¶2"}
    text: >-
      Complex dicentric chromosomes must be described as derivative chromosomes, see Section
      9.2.3.
  - rule: DER.UNKNOWN_CENTROMERE
    cite: {section: "9.2.3", page: 64, para: "¶10"}
    text: >-
      When the centromere of the derivative chromosome is not known, but more distal parts of the
      chromosome can be recognized, the abnormal chromosome may be designated der(?).
  - rule: DER.HOMOLOGUE_NOT_SPECIFIED
    cite: {section: "9.2.3", page: 64, para: "¶12"}
    text: >-
      There is usually no need to indicate which homologue is involved in a derivative chromosome
      because this will be apparent from the karyotype description. If both homologues are
      involved, this will result in two derivative homologous chromosomes.
  - rule: DER.HOMOLOGUE_UNDERLINING
    cite: {section: "9.2.3", page: 64, para: "¶13"}
    text: >-
      There is in particular one situation where this may be helpful: When the two homologous
      chromosomes are involved in identical aberrations resulting in two identical derivative
      chromosomes.
  - rule: DER.HOMOLOGUE_UNDERLINING
    cite: {section: "9.2.3", page: 65, example: E34}
    text: >-
      The two derivative chromosomes can be distinguished by underlining. In the first example,
      the derivative observed is the homologue with a break at q32. In the second example, the
      derivative is the homologue with a breakpoint in p31.
  - rule: DER.COMPLEX_USE_DETAILED
    cite: {section: "9.2.3", page: 65, para: "¶15"}
    text: >-
      Complex karyotypes involving rearrangements between two or more derivative chromosomes, or
      where derivative chromosomes are involved in new rearrangements, cannot be described by the
      short system. The detailed system will be adequate in all such situations. It is acceptable
      to combine the short system (4.3.1) and the detailed system (4.3.2) for designating complex
      karyotypes. Whenever doubts remain, the rearrangement should, to avoid ambiguity, be
      illustrated and described in words.
