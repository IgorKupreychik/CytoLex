version: "2016"
section: "4.4"
quotes:
  - rule: DER.DEFINITION
    cite: {section: "4.4", page: 44, para: "¶1"}
    text: >-
      A derivative chromosome is a structurally rearranged chromosome generated by (1) more than
      one rearrangement within a single chromosome, e.g., an inversion and a deletion of the same
      chromosome, or deletions in both arms of a single chromosome, or (2) rearrangements
      involving two or more chromosomes, e.g., the unbalanced product(s) of a translocation. An
      abnormal chromosome in which no part can be identified is referred to as a marker
      chromosome (see Section 9.2.12).
  - rule: DER.CENTROMERE_CHROMOSOME
    cite: {section: "4.4", page: 44, para: "¶2"}
    text: >-
      Derivative chromosomes are designated der. The term always refers to the chromosome(s)
      that has an intact centromere or neocentromere (Section 9.2.13). The derivative chromosome
      is specified in parentheses, followed by all aberrations involved in the generation of the
      derivative chromosome.
  - rule: DER.CENTROMERE_CHROMOSOME
    cite: {section: "4.4", page: 45, para: "¶3"}
    text: >-
      The derivative chromosomes from such a translocation would be designated der(2) and
      der(5).
  - rule: DER.ABERRATIONS_NO_COMMA
    cite: {section: "4.4", page: 44, para: "¶2"}
    text: >-
      The aberrations should be listed according to the breakpoints of the derivative chromosome
      from pter to qter and should not be separated by a comma.
  - rule: DER.ABERRATION_ORDER
    cite: {section: "4.4", page: 44, para: "¶2"}
    text: >-
      For example, der(1)t(1;3)(p32;q21)t(1;11)(q25;q13) specifies a derivative chromosome 1
      generated by two translocations, one involving the short arm with a breakpoint in 1p32 and
      the other involving the long arm with a breakpoint in 1q25.
  - rule: DER.ABERRATION_ORDER
    cite: {section: "4.3.2.2", page: 43, para: "¶1"}
    text: >-
      The aberrations should be listed according to the breakpoints of the derivative chromosome
      from pter to qter and should not be separated by a comma.
  - rule: DER.DEFINITION
    cite: {section: "9.2.3", page: 60, para: "¶1"}
    text: >-
      A derivative chromosome (der) is a structurally rearranged chromosome generated either by a
      rearrangement involving two or more chromosomes or by multiple aberrations within a single
      chromosome.
  - rule: DER.CENTROMERE_CHROMOSOME
    cite: {section: "9.2.3", page: 60, para: "¶1"}
    text: >-
      The term always refers to the chromosome that has an intact centromere.
  - rule: DER.CENTROMERE_CHROMOSOME
    cite: {section: "9.2.3", page: 61, para: "¶5"}
    text: >-
      A derivative chromosome resulting from one rearrangement involving two or more chromosomes
      is specified in parentheses, followed by the type of abnormality.
  - rule: DER.ABERRATIONS_NO_COMMA
    cite: {section: "9.2.3", page: 62, para: "¶7"}
    text: >-
      The aberrations should be listed according to the breakpoints of the derivative chromosome
      from pter to qter and should not be separated by commas.
  - rule: DER.ABERRATION_ORDER
    cite: {section: "9.2.3", page: 62, para: "¶7"}
    text: >-
      A derivative chromosome generated by more than one rearrangement involving two or more
      chromosomes is specified in parentheses, followed by all aberrations involved in the
      generation of the derivative chromosome. The aberrations should be listed according to the
      breakpoints of the derivative chromosome from pter to qter and should not be separated by
      commas.
