    note: >-
      Fig. 5 subdivides Xp22.3 into Xp22.33, Xp22.32, Xp22.31 at the 550-band level; NCBI's 550 set has Xp22.3 only. Book wins: the sub-bands get level 550, Xp22.3 loses it.
  - level: 550
    region: 'Xq11'
    book: ['Xq11.1', 'Xq11.2']
    ncbi: ['Xq11']
    resolution: book
    cite: {section: '2.5', page: 29, float: 'Fig. 5'}
    note: >-
      Fig. 5 subdivides Xq11 into Xq11.1, Xq11.2 at the 550-band level; NCBI's 550 set has Xq11 only. Book wins: the sub-bands get level 550, Xq11 loses it.
  - level: 550
    region: 'Yp11.3'
    book: ['Yp11.32', 'Yp11.31']
    ncbi: ['Yp11.3']
    resolution: book
    cite: {section: '2.5', page: 29, float: 'Fig. 5'}
    note: >-
      Fig. 5 subdivides Yp11.3 into Yp11.32, Yp11.31 at the 550-band level; NCBI's 550 set has Yp11.3 only. Book wins: the sub-bands get level 550, Yp11.3 loses it.
  - level: 850
    region: '1q32.1'
    book: ['1q32.11', '1q32.12', '1q32.13']
    ncbi: ['1q32.1']
    resolution: book
    cite: {section: '2.5', page: 16, float: 'Fig. 5'}
    note: >-
      Fig. 5 subdivides 1q32.1 into 1q32.11, 1q32.12, 1q32.13 at the 850-band level; NCBI's 850 set has 1q32.1 only. Book wins: the sub-bands get level 850, 1q32.1 loses it. No public source subdivides it, so the sub-bands have no coordinates or stain.
  - level: 850
    region: '2p21'
    book: ['2p21.3', '2p21.2', '2p21.1']
    ncbi: ['2p21']
    resolution: book
    cite: {section: '2.5', page: 17, float: 'Fig. 5'}
    note: >-
      Fig. 5 subdivides 2p21 into 2p21.3, 2p21.2, 2p21.1 at the 850-band level; NCBI's 850 set has 2p21 only. Book wins: the sub-bands get level 850, 2p21 loses it. No public source subdivides it, so the sub-bands have no coordinates or stain.
  - level: 850
    region: '5q13.2'
    book: ['5q13.21', '5q13.22', '5q13.23']
    ncbi: ['5q13.2']
    resolution: book
    cite: {section: '2.5', page: 20, float: 'Fig. 5'}
    note: >-
      Fig. 5 subdivides 5q13.2 into 5q13.21, 5q13.22, 5q13.23 at the 850-band level; NCBI's 850 set has 5q13.2 only. Book wins: the sub-bands get level 850, 5q13.2 loses it. No public source subdivides it, so the sub-bands have no coordinates or stain.
  - level: 850
    region: '6p24'
    book: ['6p24']
    ncbi: ['6p24.3', '6p24.2', '6p24.1']
    resolution: book
    keep: ['6p24.3', '6p24.2', '6p24.1']
    cite: {section: '2.5', page: 21, float: 'Fig. 5'}
    note: >-
      Fig. 5 shows 6p24 undivided at the 850-band level; NCBI's 850 set has 6p24.3, 6p24.2, 6p24.1. Book wins: 6p24 gets level 850. 6p24.3, 6p24.2, 6p24.1 appear in no idiogram of the book; listed under keep, they stay valid with their NCBI level 850 and book: false, since array/sequence notation uses genome-assembly bands.
  - level: 850
    region: '6p22.3'
    book: ['6p22.33', '6p22.32', '6p22.31']
    ncbi: ['6p22.3']
    resolution: book
    cite: {section: '2.5', page: 21, float: 'Fig. 5'}
    note: >-
      Fig. 5 subdivides 6p22.3 into 6p22.33, 6p22.32, 6p22.31 at the 850-band level; NCBI's 850 set has 6p22.3 only. Book wins: the sub-bands get level 850, 6p22.3 loses it. No public source subdivides it, so the sub-bands have no coordinates or stain.
  - level: 850
    region: '6q21'
    book: ['6q21.1', '6q21.2', '6q21.3']
    ncbi: ['6q21']
    resolution: book
    cite: {section: '2.5', page: 21, float: 'Fig. 5'}
    note: >-
      Fig. 5 subdivides 6q21 into 6q21.1, 6q21.2, 6q21.3 at the 850-band level; NCBI's 850 set has 6q21 only. Book wins: the sub-bands get level 850, 6q21 loses it. No public source subdivides it, so the sub-bands have no coordinates or stain.
  - level: 850
    region: '9q34.1'
    book: ['9q34.1']
    ncbi: ['9q34.11', '9q34.12', '9q34.13']
    resolution: book
    keep: ['9q34.11', '9q34.12', '9q34.13']
    cite: {section: '2.5', page: 23, float: 'Fig. 5'}
