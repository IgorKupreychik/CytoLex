    note: >-
      Fig. 5 subdivides 4p16 into 4p16.3, 4p16.2, 4p16.1 at the 550-band level; NCBI's 550 set has 4p16 only. Book wins: the sub-bands get level 550, 4p16 loses it.
  - level: 550
    region: '8q24.2'
    book: ['8q24.21', '8q24.22', '8q24.23']
    ncbi: ['8q24.2']
    resolution: book
    cite: {section: '2.5', page: 22, float: 'Fig. 5'}
    note: >-
      Fig. 5 subdivides 8q24.2 into 8q24.21, 8q24.22, 8q24.23 at the 550-band level; NCBI's 550 set has 8q24.2 only. Book wins: the sub-bands get level 550, 8q24.2 loses it.
  - level: 550
    region: '11q24'
    book: ['11q24.1', '11q24.2', '11q24.3']
    ncbi: ['11q24']
