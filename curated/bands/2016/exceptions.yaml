# Differences between the ISCN 2016 idiograms (Fig. 5, decoded into ideograms.yaml) and the
# NCBI Genome Decoration Page band sets, per level (T-007). `kb bands` fails on a difference
# without an entry here and on an entry that no longer matches a difference; a draft of all
# current differences is written to build/review/bands/2016/exceptions-draft.yaml.
# Policy (decided 2026-11-16/17): the book wins (resolution: book), each case cited. NCBI names
# that no book level shows stay valid only when listed under `keep` (flagged book: false).
# Schema: kb/schema/band-exceptions.schema.json; check with `kb check curated/bands/2016/exceptions.yaml`.
version: '2016'
exceptions:
  - level: 400
    region: '15q26'
    book: ['15q26.1', '15q26.2', '15q26.3']
    ncbi: ['15q26']
    resolution: book
    cite: {section: '2.5', page: 26, float: 'Fig. 5'}
    note: >-
      Fig. 5 subdivides 15q26 into 15q26.1, 15q26.2, 15q26.3 at the 400-band level; NCBI's 400 set has 15q26 only. Book wins: the sub-bands get level 400, 15q26 loses it.
  - level: 400
    region: '16q12'
    book: ['16q12']
    ncbi: ['16q12.1', '16q12.2']
    resolution: book
    cite: {section: '2.5', page: 26, float: 'Fig. 5'}
    note: >-
      Fig. 5 prints the merged band '12–13' (16q12–q13) at the 400-band level, read as 16q12 and 16q13; NCBI's 400 set has 16q12.1, 16q12.2 (and 16q13). Book wins: 16q12 gets level 400, its sub-bands lose it.
  - level: 400
    region: '18q21'
    book: ['18q21.1', '18q21.2', '18q21.3']
    ncbi: ['18q21']
    resolution: book
    cite: {section: '2.5', page: 27, float: 'Fig. 5'}
    note: >-
      Fig. 5 subdivides 18q21 into 18q21.1, 18q21.2, 18q21.3 at the 400-band level; NCBI's 400 set has 18q21 only. Book wins: the sub-bands get level 400, 18q21 loses it.
  - level: 400
    region: 'Yq11.2'
    book: ['Yq11.21', 'Yq11.22', 'Yq11.23']
    ncbi: ['Yq11.2']
    resolution: book
    cite: {section: '2.5', page: 29, float: 'Fig. 5'}
    note: >-
      Fig. 5 subdivides Yq11.2 into Yq11.21, Yq11.22, Yq11.23 at the 400-band level; NCBI's 400 set has Yq11.2 only. Book wins: the sub-bands get level 400, Yq11.2 loses it.
  - level: 550
    region: '1q21'
    book: ['1q21']
    ncbi: ['1q21.1', '1q21.2', '1q21.3']
    resolution: book
    cite: {section: '2.5', page: 16, float: 'Fig. 5'}
    note: >-
      Fig. 5 shows 1q21 undivided at the 550-band level; NCBI's 550 set has 1q21.1, 1q21.2, 1q21.3. Book wins: 1q21 gets level 550, the sub-bands lose it.
  - level: 550
    region: '1q23'
    book: ['1q23.1', '1q23.2', '1q23.3']
    ncbi: ['1q23']
    resolution: book
    cite: {section: '2.5', page: 16, float: 'Fig. 5'}
    note: >-
      Fig. 5 subdivides 1q23 into 1q23.1, 1q23.2, 1q23.3 at the 550-band level; NCBI's 550 set has 1q23 only. Book wins: the sub-bands get level 550, 1q23 loses it.
  - level: 550
    region: '1q25'
    book: ['1q25.1', '1q25.2', '1q25.3']
    ncbi: ['1q25']
    resolution: book
    cite: {section: '2.5', page: 16, float: 'Fig. 5'}
    note: >-
      Fig. 5 subdivides 1q25 into 1q25.1, 1q25.2, 1q25.3 at the 550-band level; NCBI's 550 set has 1q25 only. Book wins: the sub-bands get level 550, 1q25 loses it.
  - level: 550
    region: '3p11'
    book: ['3p11.2', '3p11.1']
    ncbi: ['3p11']
    resolution: book
    cite: {section: '2.5', page: 18, float: 'Fig. 5'}
    note: >-
      Fig. 5 subdivides 3p11 into 3p11.2, 3p11.1 at the 550-band level; NCBI's 550 set has 3p11 only. Book wins: the sub-bands get level 550, 3p11 loses it.
  - level: 550
