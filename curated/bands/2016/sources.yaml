# Book idiograms (T-007): `kb ideograms` decodes the band labels of Fig. 5 from the PDF text
# layer into kb/bands/2016/ideograms.yaml; `kb bands` compares them with the NCBI sets and
# applies curated/bands/2016/exceptions.yaml. Labels use a figure-only font whose glyphs map to
# private-use code points; every mapping below was checked against rendered pages.
ideograms:
  figure: Fig. 5
  section: '2.5'
  pages: [16, 29]  # book pages
  font: TTE2340D80t00
  chromosome_font: MyriadPro-Bold  # chromosome number below each row
  chromosome_min_size: 10
  glyphs:
    U+F001: '3'
    U+F002: '6'
    U+F003: '.'
    U+F004: '2'
    U+F005: '1'
    U+F006: '5'
    U+F007: '4'
    U+F008: '–'  # range of merged bands at the 300 level ('22–24')
    U+F009: p
    U+F00A: q
    U+F00B: '7'
    U+F00C: '8'
    U+F00D: '9'
  # Visual sign-off (by a person) of the decoded labels against the rendered idiograms (`kb ideograms`
  # writes build/review/bands/2016/chr<N>.png + .txt).
  spot_check:
    - {chrom: '1', page: 16, human: ok, date: '2026-11-17'}
    - {chrom: '9', page: 23, human: ok, date: '2026-11-17'}
    - {chrom: '22', page: 28, human: ok, date: '2026-11-17'}
    - {chrom: 'X', page: 29, human: ok, date: '2026-11-17'}
