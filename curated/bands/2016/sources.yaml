# Band data sources for ISCN 2016 (T-006). Read by `kb bands`; committed.
#
# NCBI Genome Decoration Page ideograms give the real 400/550/850 band sets per assembly
# (GCF_000001305.13 = GRCh37, .16 = GRCh38; .14/.15 are byte-identical to .16).
# UCSC cytoBand (850 level only) cross-checks names and coordinates and is the canonical
# source of 850-level coordinates. No public source has the 300 or 700 level; they come from
# the book's idiograms (T-007, section `ideograms` below).
#
# sha256 pins the exact bytes downloaded; a mismatch fails the run. After a deliberate
# upstream change, re-pin with `kb bands --update-pins` and review the band diff.
version: '2016'
levels_unavailable: []  # 300/700 come from the book's idiograms (T-007)
files:
  - id: ncbi-grch37-400
    kind: ncbi_gdp
    assembly: GRCh37
    level: 400
    url: https://ftp.ncbi.nlm.nih.gov/pub/gdp/ideogram_9606_GCF_000001305.13_400_V1
    sha256: 'a708931be17f6d15da6b47110ee09f374592831894025e34db76bf1171c08eed'
  - id: ncbi-grch37-550
    kind: ncbi_gdp
