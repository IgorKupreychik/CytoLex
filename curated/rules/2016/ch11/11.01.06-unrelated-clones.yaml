version: "2016"
section: "11.1.6"
rules:
  - id: CLONE.ORDER_UNRELATED
    title: Unrelated clones by decreasing size, after related clones
    applies_to: [karyotype]
    context: [neoplastic]
    severity: warning
    statement: >-
      Clones with completely unrelated abnormalities are listed by size, largest first. Two
      clones of equal size are ordered with sex chromosome abnormalities first, then by the
      autosome number, smallest to largest. When a tumour has related and unrelated clones, the
      related ones come first in order of increasing complexity (section 11.1.4), followed by
      the unrelated ones by decreasing size. An abnormality that was identified earlier is
      listed first among unrelated clones, whatever its number of cells.
    cite:
      - {section: "11.1.6", page: 89, para: "¶1"}
      - {section: "11.1.6", page: 89, para: "¶2"}
      - {section: "11.1.6", page: 90, para: "¶3"}
      - {section: "9.2.17.4", page: 79, para: "¶1"}
    examples:
      valid:
        - text: "46,XX,t(3;9)(p13;p13)[14]/48,XX,+3,+9[11]/46,XX,t(1;6)(p11;p12)[9]/47,XX,t(6;10)(q12;p15),+7[6]/46,XX,inv(6)(p22q23)[3]/46,XX[7]"
          cite: {section: "11.1.6", page: 89, example: E1}
          note: Printed over two lines; joined. Decreasing size; the normal diploid clone last.
        - text: "50,XX,t(2;6)(p22;q16),…[19]/51,sl,+8[7]/52,sdl1,+9[12]/46,XX,del(3)(q13)[11]/47,XX,+7[6]/46,XX,t(1;3)(p22;p14)[4]"
          cite: {section: "11.1.6", page: 89, example: E2}
          note: Printed over two lines; joined. The related clones come first, then the unrelated ones by decreasing size.
        - text: "50,XX,t(2;6)(p22;q16),…[19]/51,idem,+8[7]/52,idem,+8,+9[12]/46,XX,del(3)(q13)[11]/47,XX,+7[6]/46,XX,t(1;3)(p22;p14)[4]"
          cite: {section: "11.1.6", page: 89, example: E2}
          note: Printed over two lines; joined.
      invalid:
        - text: "46,XX,t(1;6)(p11;p12)[9]/46,XX,t(3;9)(p13;p13)[14]/46,XX[7]"
          why: Warning - the clone with 14 cells comes before the clone with 9 cells, unless the t(1;6) was identified earlier.
          corrected: "46,XX,t(3;9)(p13;p13)[14]/46,XX,t(1;6)(p11;p12)[9]/46,XX[7]"
        - text: "46,XX,t(1;6)(p11;p12)[9]/47,XX,+X[9]/46,XX[7]"
          why: Warning - with equal clone sizes, the sex chromosome abnormality comes first.
          corrected: "47,XX,+X[9]/46,XX,t(1;6)(p11;p12)[9]/46,XX[7]"
        - text: "46,XY,t(9;22)(q34;q11.2)[6]/46,XY,t(1;3)(p22;p14)[14]"
          cite: {section: "11.1.6", page: 90, example: E3}
          why: >-
            Warning - printed as valid because the t(9;22) was identified previously (¶3); a
            string can't show that, so the smaller clone first is flagged.
          corrected: "46,XY,t(1;3)(p22;p14)[14]/46,XY,t(9;22)(q34;q11.2)[6]"
    fix: {level: 1, kind: reorder, hint: "Order the unrelated clones by decreasing size (ties: sex chromosomes first, then autosome number), after the related clones."}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        Severity warning (T-014, with the user): ¶3 lets a previously identified abnormality come
        first regardless of size, which a string can't show, so a size-order fault is never
        certain. Following the KB policy, the printed E3 is an invalid (warning) form with its
        cite. The first two invalid examples are inferred. TRANSLOC.JUMPING (§9.2.17.4) refers
        here for the order of its clones.
    related: [CLONE.ORDER_RELATED, CLONE.NORMAL_LAST, TRANSLOC.JUMPING, KARYO.CLONE_ORDER_CONSTITUTIONAL]

  - id: CLONE.NORMAL_LAST
    title: Normal diploid and constitutional-only clones listed last
    applies_to: [karyotype]
    context: [neoplastic]
    severity: error
    statement: >-
      In a tumour karyotype, a normal diploid clone, when present, is always listed last. A
      clone that has only a constitutional anomaly is, like the normal diploid clone, always
      listed last, whatever its size.
    cite:
      - {section: "11.1.6", page: 89, para: "¶1"}
      - {section: "11.3", page: 90, para: "¶1"}
      - {section: "11.3", page: 91, para: "¶2"}
    examples:
      valid:
        - text: "48,XY,+8,+21c[3]/49,idem,+9[5]/47,XY,+21c[12]"
          cite: {section: "11.3", page: 91, example: E6}
          note: The clone with only the constitutional trisomy 21 is last, though it is the largest.
        - text: "49,XX,t(2;13)(q37;q14),+18c,+18,+mar[3]/47,XX,+18c[17]"
          cite: {section: "11.3", page: 91, example: E7}
        - text: "46,XX,t(9;22)(q34;q11.2)[1]/46,XX[19]"
          cite: {section: "11.1.1", page: 84, example: E2}
      invalid:
        - text: "46,XX[7]/46,XX,t(3;9)(p13;p13)[14]/48,XX,+3,+9[11]"
          why: The normal diploid clone must be listed last.
          corrected: "46,XX,t(3;9)(p13;p13)[14]/48,XX,+3,+9[11]/46,XX[7]"
        - text: "47,XY,+21c[12]/48,XY,+8,+21c[3]/49,XY,+8,+9,+21c[5]"
          why: The clone with only the constitutional trisomy 21 must be listed last, whatever its size.
          corrected: "48,XY,+8,+21c[3]/49,XY,+8,+9,+21c[5]/47,XY,+21c[12]"
    fix: {level: 1, kind: reorder, hint: Move the normal diploid clone or the constitutional-only clone to the end.}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        Both invalid examples are inferred. The first has no context marker; in a constitutional
        reading the same fault belongs to KARYO.CLONE_ORDER_CONSTITUTIONAL. The second avoids
        idem on purpose: idem always refers to the first karyotype, so reordering an idem string
        would change its meaning.
    related: [CLONE.ORDER_UNRELATED, CLONE.ORDER_RELATED, KARYO.CLONE_ORDER_CONSTITUTIONAL]
