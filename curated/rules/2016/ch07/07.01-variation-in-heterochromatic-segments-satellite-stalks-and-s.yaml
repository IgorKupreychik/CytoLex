version: "2016"
section: "7.1"
rules:
  - id: VAR.DEFINITION
    title: Normal variation of heterochromatin, stalks and satellites
    applies_to: [karyotype]
    severity: info
    statement: >-
      Variation here means population differences in the size or staining of chromosome
      segments, such as heterochromatic segments, satellite stalks and satellites. These normal
      variants have their own notation (sections 7.1.1 and 7.1.2), distinct from structural
      abnormalities.
    cite:
      - {section: "7.1", page: 52, para: "¶1"}
    examples:
      valid: []
    review: {paraphrase_checked: true, needs_review: false}
    related: [VAR.LENGTH_SIGN, VAR.POSITION_AND_NUMBER, BAND.VARIABLE_REGIONS]
