version: "2016"
section: "9.2.17.2"
rules:
  - id: TRANSLOC.WHOLE_ARM
    title: Whole-arm translocation - p10/q10, first chromosome gets p10
    applies_to: [karyotype]
    severity: error
    statement: >-
      In a whole-arm translocation the breakpoints are the centromeric bands p10 and q10, chosen by
      the morphology of the abnormal chromosomes. In a balanced whole-arm exchange, the chromosome
      listed first (a sex chromosome or the lowest-numbered one) has its breakpoint written as p10.
      The arms are fused at the centromeres: in t(1;3)(p10;q10) the short arm of 1 with the long arm
      of 3, and the long arm of 1 with the short arm of 3.
    cite:
      - {section: "9.2.17.2", page: 77, para: "¶1"}
      - {section: "9.2.17.2", page: 77, example: E1}
    examples:
      valid:
        - text: "46,XY,t(1;3)(p10;q10)"
          cite: {section: "9.2.17.2", page: 77, example: E1}
        - text: "46,XY,t(1;3)(1pter→1p10::3q10→3qter;3pter→3p10::1q10→1qter)"
          cite: {section: "9.2.17.2", page: 77, example: E1}
        - text: "46,XY,t(1;3)(p10;p10)"
          cite: {section: "9.2.17.2", page: 77, example: E2}
        - text: "46,XY,t(1;3)(1pter→1p10::3p10→3pter;1qter→1q10::3q10→3qter)"
          cite: {section: "9.2.17.2", page: 77, example: E2}
      invalid:
        - text: "46,XY,t(1;3)(q10;p10)"
          why: In a balanced whole-arm exchange the breakpoint of the first chromosome (1) is written p10; this is the same exchange as t(1;3)(p10;q10).
          corrected: "46,XY,t(1;3)(p10;q10)"
    fix: {level: 1, kind: replace, hint: Write the first chromosome's breakpoint as p10 and the partner's as the matching p10/q10.}
    review:
      paraphrase_checked: false
      needs_review: false
      note: >-
        The second invalid example is inferred from "assigning the breakpoints to the centromeric
        bands"; a proven dicentric uses p11.2/q11.2 and dic (ROB.DICENTRIC_USE_DIC).
        Statement extended for the band composition of the short system (T-066), from the cited example notes.
    related: [BAND.CENTROMERE_10, STRUCT.CHROMOSOME_ORDER, DER.WHOLE_ARM_TWO_CHROMOSOMES, ROB.FORMAT]

  - id: DER.WHOLE_ARM_TWO_CHROMOSOMES
    title: der(a;b) from an unbalanced whole-arm translocation
    applies_to: [karyotype]
    severity: error
    statement: >-
      A derivative from an unbalanced whole-arm translocation is written der(chromosome;chromosome)
      with the p10/q10 breakpoints. It replaces both normal chromosomes involved, which are not
      written as missing; the imbalance follows from the karyotype. A further normal copy of one of
      the two chromosomes is written +, and the loss of the remaining normal copy –.
    cite:
      - {section: "9.2.17.2", page: 77, para: "¶2"}
    examples:
      valid:
        - text: "45,XX,der(1;3)(p10;q10)"
          cite: {section: "9.2.17.2", page: 77, example: E3}
        - text: "45,XX,der(1;3)(1pter→1p10::3q10→3qter)"
          cite: {section: "9.2.17.2", page: 77, example: E3}
        - text: "46,XX,+1,der(1;3)(p10;q10)"
          cite: {section: "9.2.17.2", page: 77, example: E4}
        - text: "46,XX,der(1;3)(p10;q10),+3"
          cite: {section: "9.2.17.2", page: 77, example: E5}
        - text: "47,XX,+der(1;3)(p10;q10)"
          cite: {section: "9.2.17.2", page: 77, example: E6}
        - text: "44,XY,–1,der(1;3)(p10;q10)"
          cite: {section: "9.2.17.2", page: 78, example: E7}
      invalid:
        - text: "45,XX,–1,–3,der(1;3)(p10;q10)"
          why: The der(1;3) replaces one chromosome 1 and one chromosome 3; they are not written as missing.
          corrected: "45,XX,der(1;3)(p10;q10)"
        - text: "45,XX,der(1)t(1;3)(p10;q10)"
          why: The derivative of an unbalanced whole-arm translocation is named after both chromosomes, der(1;3).
          corrected: "45,XX,der(1;3)(p10;q10)"
    fix: {level: 1, kind: delete, hint: Remove the losses of the two chromosomes that the der replaces.}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        The second invalid example is inferred from E3 (the book does not show the der(1)t(1;3) form).
        Robertsonian form: ROB.FORMAT.
    related: [KARYO.REPLACED_NORMAL_NOT_MISSING, TRANSLOC.WHOLE_ARM, ROB.FORMAT, DIC.FORMAT, KARYO.GAIN_LOSS_SIGN]
