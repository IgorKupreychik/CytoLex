version: "2016"
section: "9.2.3"
rules:
  - id: REC.NOT_ACQUIRED
    title: rec is not used for acquired abnormalities
    applies_to: [karyotype]
    context: [neoplastic]
    severity: error
    statement: >-
      A recombinant chromosome arises from meiotic crossing-over, so rec must not be used to
      describe acquired chromosome abnormalities; an acquired rearranged chromosome is a der.
    cite:
      - {section: "9.2.3", page: 60, para: "¶2"}
    examples:
      valid: []
      invalid:
        - text: "46,XX,rec(6)dup(6p)inv(6)(p22.2q25.2)"
          why: In an acquired (neoplastic) karyotype a rearranged chromosome cannot be a meiotic recombinant.
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        Only checkable when the context (neoplastic) is known; the invalid example is the book's
        §9.2.3 E2 short form without mat, read as an acquired karyotype.
    related: [REC.DEFINITION, REC.KNOWN_PARENTAL_REARRANGEMENT]

  - id: DER.NO_PH_SYMBOL
    title: Ph only in text; der(22)t(9;22) in the karyotype
    applies_to: [karyotype]
    severity: error
    statement: >-
      The Philadelphia chromosome (abbreviated Ph, formerly Ph1) is the der(22) of the
      translocation t(9;22)(q34;q11.2). Ph may be used in text but not in a karyotype, where
      der(22)t(9;22)(q34;q11.2) is written; the reciprocal product is der(9)t(9;22)(q34;q11.2).
    cite:
      - {section: "9.2.3", page: 62, para: "¶6"}
    examples:
      valid:
        - text: "der(22)t(9;22)(q34;q11.2)"
          cite: {section: "9.2.3", page: 62, para: "¶6"}
          note: Printed with a line-wrap space (der(22) t(9;22)…); written here without it.
        - text: "der(9)t(9;22)(q34;q11.2)"
          cite: {section: "9.2.3", page: 62, para: "¶6"}
        - text: "47,XX,t(9;22)(q34;q11.2),+der(22)t(9;22)"
          cite: {section: "9.2.3", page: 65, example: E35}
      invalid:
        - text: "47,XX,t(9;22)(q34;q11.2),+Ph"
          why: Ph is a term for text; in the karyotype the extra Ph chromosome is written as a der(22).
          corrected: "47,XX,t(9;22)(q34;q11.2),+der(22)t(9;22)"
    fix: {level: 1, kind: replace, hint: "Replace Ph by der(22)t(9;22)(q34;q11.2), or by der(22)t(9;22) when the t(9;22) is written in the karyotype."}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        Ph is in the ch. 3 symbol list, so SYM.LISTED_ONLY does not catch it. Severity error
        (T-056): "not in the description of the karyotype" forbids Ph; "recommended" refers only to
        the der(22) wording that replaces it.
    related: [DER.CENTROMERE_CHROMOSOME, SYM.LISTED_ONLY]

  - id: DER.INSERTION_POINT_CONVENTION
    title: Insertion point of a der with a replaced segment
    applies_to: [karyotype]
    severity: info
    statement: >-
      When an inserted segment replaces a deleted one, so that the recipient chromosome has two
      breakpoints, the proximal breakpoint is given as the insertion point. When unknown material
      has replaced a segment and further material is attached to it, the breakpoint in the
      derivative is given as the insertion point of the unknown material.
    cite:
      - {section: "9.2.3", page: 63, example: E18}
      - {section: "9.2.3", page: 63, example: E19}
    examples:
      valid:
        - text: "46,XX,der(1)del(1)(p22p34)ins(1;17)(p22;q11q25)"
          cite: {section: "9.2.3", page: 63, example: E18}
        - text: "46,XX,der(1)(1pter→1p34::17q25→17q11::1p22→1qter)"
          cite: {section: "9.2.3", page: 63, example: E18}
        - text: "46,XY,der(7)t(2;7)(q21;q22)ins(7;?)(q22;?)"
          cite: {section: "9.2.3", page: 63, example: E19}
        - text: "46,XY,der(7)(7pter→7q22::?::2q21→2qter)"
          cite: {section: "9.2.3", page: 63, example: E19}
    review:
      paraphrase_checked: true
      needs_review: false
    related: [ADD.INSERTED_UNKNOWN_USE_INS, STRUCT.INSERTION_RECEPTOR_FIRST]

  - id: DER.ISODERIVATIVE
    title: ider for an isochromosome of a derivative
    applies_to: [karyotype]
    severity: error
    statement: >-
      An isochromosome formed for one arm of a derivative chromosome is an isoderivative, written
      ider(chromosome) with the breakpoint p10 or q10 (by its morphology), followed by the
      aberrations that produced the derivative.
    cite:
      - {section: "9.2.3", page: 63, para: "¶8"}
      - {section: "9.2.11", page: 70, para: "¶2"}
    examples:
      valid:
        - text: "46,XX,ider(22)(q10)t(9;22)(q34;q11.2)"
          cite: {section: "9.2.3", page: 63, example: E21}
        - text: "46,XX,ider(22)(9qter→9q34::22q11.2→22q10::22q10→22q11.2::9q34→9qter)"
          cite: {section: "9.2.3", page: 63, example: E21}
        - text: "46,XY,ider(9)(p10)ins(9;12)(p13;q13q22)"
          cite: {section: "9.2.3", page: 63, example: E22}
        - text: "46,XY,ider(9)(9pter→9p13::12q22→12q13::9p13→9p10::9p10→9p13::12q13→12q22::9p13→9pter)"
          cite: {section: "9.2.3", page: 63, example: E22}
          note: Printed over two lines (break after "12q13→"); joined here without a space.
      invalid:
        - text: "46,XX,ider(22)(q11.2)t(9;22)(q34;q11.2)"
          why: The breakpoint of an isoderivative is the centromeric band p10 or q10.
          corrected: "46,XX,ider(22)(q10)t(9;22)(q34;q11.2)"
    fix: {level: 1, kind: replace, hint: "Write the breakpoint of the isoderivative as p10 or q10."}
    review:
      paraphrase_checked: true
      needs_review: false
    related: [DER.CENTROMERE_CHROMOSOME, BAND.CENTROMERE_10, ISO.FORMAT]

  - id: DER.DICENTRIC_FORMAT
    title: Dicentric derivative names both centromere chromosomes
    applies_to: [karyotype]
    severity: error
    statement: >-
      A dicentric derivative chromosome with one or more further abnormalities is written der
      with both centromere-bearing chromosomes in the parentheses, separated by a semicolon
      (der(5;7)), followed by its aberrations.
    cite:
      - {section: "9.2.3", page: 63, para: "¶9"}
      - {section: "9.2.4", page: 66, para: "¶2"}
    examples:
      valid:
        - text: "45,XX,der(5;7)t(5;7)(q22;p13)t(3;7)(q21;q21)"
          cite: {section: "9.2.3", page: 63, example: E23}
        - text: "45,XX,der(5;7)(5pter→5q22::7p13→7q21::3q21→3qter)"
          cite: {section: "9.2.3", page: 63, example: E23}
        - text: "45,XY,der(5;7)t(3;5)(q21;q22)t(3;7)(q29;p13)"
          cite: {section: "9.2.3", page: 63, example: E24}
        - text: "45,XY,der(5;7)(5pter→5q22::3q21→3q29::7p13→7qter)"
          cite: {section: "9.2.3", page: 63, example: E24}
        - text: "45,XY,der(5;7)t(3;5)(q21;q22)t(3;7)(q29;p13)del(7)(q32)"
          cite: {section: "9.2.3", page: 63, example: E25}
        - text: "45,XY,der(5;7)(5pter→5q22::3q21→3q29::7p13→7q32:)"
          cite: {section: "9.2.3", page: 63, example: E25}
        - text: "45,XX,der(8;8)(q10;q10)del(8)(q22)t(8;9)(q24.1;q12)"
          cite: {section: "9.2.3", page: 64, example: E26}
          note: Whole-arm (q10;q10) derivative - its own breakpoints follow der(8;8) before the further aberrations.
        - text: "45,XX,der(8;8)(:8q22→8q10::8q10→8q24.1::9q12→9qter)"
          cite: {section: "9.2.3", page: 64, example: E26}
      invalid:
        - text: "45,XX,dic(5;7)(q22;p13)t(3;7)(q21;q21)"
          why: A dicentric chromosome with a further abnormality must be written as a derivative, der(5;7).
          corrected: "45,XX,der(5;7)t(5;7)(q22;p13)t(3;7)(q21;q21)"
    fix: {level: 1, kind: replace, hint: "Write der(a;b) followed by all aberrations, the dicentric itself as t(a;b) with its breakpoints."}
    review:
      paraphrase_checked: true
      needs_review: false
    related: [DIC.FORMAT, DER.MULTIPLE_ABERRATIONS_ONE_CHROMOSOME, STRUCT.CHROMOSOME_SEPARATOR]

  - id: DER.UNKNOWN_CENTROMERE
    title: der(?) when the centromere is unknown
    applies_to: [karyotype]
    severity: info
    statement: >-
      When the centromere of a derivative chromosome is not known but more distal parts can be
      recognized, the chromosome may be written der(?), with ? also standing for the unknown
      partner in its aberrations (t(?;9)(?;q22)).
    cite:
      - {section: "9.2.3", page: 64, para: "¶10"}
    examples:
      valid:
        - text: "47,XY,+der(?)t(?;9)(?;q22)"
          cite: {section: "9.2.3", page: 64, example: E27}
        - text: "47,XY,+der(?)(?→?cen→?::9q22→9qter)"
          cite: {section: "9.2.3", page: 64, example: E27}
        - text: "47,XX,+der(?)t(?;9)(?;p13)ins(?;7)(?;q11.2q32)"
          cite: {section: "9.2.3", page: 64, example: E28}
        - text: "47,XX,+der(?)(9pter→9p13::?→cen→?::7q11.2→7q32::?)"
          cite: {section: "9.2.3", page: 64, example: E28}
        - text: "47,XX,+der(?)t(?;9)(?;p13)hsr(?)"
          cite: {section: "9.2.3", page: 64, example: E29}
        - text: "47,XX,+der(?)(9pter→9p13::?→cen→?::hsr→?)"
          cite: {section: "9.2.3", page: 64, example: E29}
        - text: "47,XX,+der(?)t(?;15)(?;q22)"
          cite: {section: "9.2.12", page: 71, example: E6}
        - text: "47,XX,+der(?)r(?;3;5)(?;q21q26.2;q13q33)"
          cite: {section: "9.2.15", page: 73, example: E5}
          note: Ring with an unknown centromere (RING.MONOCENTRIC_AS_DER).
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        E27 writes ?cen, E28/E29 write ?→cen in the detailed form; both kept as printed.
        Placement in the karyotype: ORDER.UNKNOWN_CENTROMERE_DER.
        Band composition (T-087): E28/E29 put the insertion and the hsr on an arm of the
        unknown chromosome that only the captions name ("in the long arm"); the short system
        doesn't say where, so CytoLex computes no composition for an insertion or hsr on the
        unknown chromosome (no convention inferred from the examples).
    related: [ORDER.UNKNOWN_CENTROMERE_DER, UNCERTAIN.QUESTION_MARK_DESIGNATION, RING.MONOCENTRIC_AS_DER]

  - id: DER.HOMOLOGUE_NOT_SPECIFIED
    title: No need to say which homologue forms a der
    applies_to: [karyotype]
    severity: info
    statement: >-
      Which homologue is involved in a derivative chromosome usually need not be indicated; the
      karyotype makes it apparent. If both homologues are involved, two derivative homologues
      are written.
    cite:
      - {section: "9.2.3", page: 64, para: "¶12"}
    examples:
      valid:
        - text: "46,XX,der(9)del(9)(p12)t(9;22)(q34;q11.2),der(9)t(9;12)(p13;q22)inv(9)(q13q22)"
          cite: {section: "9.2.3", page: 64, example: E31}
    review:
      paraphrase_checked: true
      needs_review: false
    related: [DER.HOMOLOGUE_UNDERLINING]

  - id: DER.HOMOLOGUE_UNDERLINING
    title: Underlining to tell identical derivative homologues apart
    applies_to: [karyotype]
    severity: info
    statement: >-
      When homologous chromosomes cannot otherwise be told apart, one of the chromosome numbers
      may be underlined. This helps mainly when both homologues show identical aberrations,
      giving two identical derivatives (der(1)t(1;3)(p34.3;q21),der(1̲)t(1̲;3)(p34.3;q21)), and
      in der(1̲)t(1;1̲) versus der(1)t(1;1̲) to show which homologue carries the centromere.
    cite:
      - {section: "9.2.3", page: 64, para: "¶13"}
    examples:
      valid:
        - text: "46,XX,der(1)t(1;3)(p34.3;q21),der(1̲)t(1̲;3)(p34.3;q21)"
          cite: {section: "9.2.3", page: 64, example: E32}
        - text: "46,XX,der(1)t(1;3)(p34.3;q21)[20]/46,XX,der(1̲)t(1̲;3)(p34.3;q21)[10]"
          cite: {section: "9.2.3", page: 64, example: E33}
          note: Two clones, each with one der(1); the underlining shows they involve different homologues.
        - text: "46,XX,der(1̲)t(1;1̲)(p31;q32)"
          cite: {section: "9.2.3", page: 65, example: E34}
        - text: "46,XX,der(1)t(1;1̲)(p31;q32)"
          cite: {section: "9.2.3", page: 65, example: E34}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        §9.2.3 is on the underlined-homologue list (docs/extraction-review-2016.md). Underlining is
        U+0332 after the digit, as recovered by the extractor (T-003). Input convention (T-042):
        U+0332 after each underlined character is the only form; the validator accepts it on
        chromosome identifiers, and underlining elsewhere stays not validated.
    related: [DER.HOMOLOGUE_NOT_SPECIFIED, FRA.HOMOLOGUE_UNDERLINING]

  - id: DER.COMPLEX_USE_DETAILED
    title: Rearranged derivatives need the detailed system
    applies_to: [karyotype]
    severity: info
    statement: >-
      Rearrangements between two or more derivative chromosomes, or derivatives that take part in
      new rearrangements, cannot be written in the short system; the detailed system covers all
      such cases. Short and detailed systems may be combined in one complex karyotype. If doubt
      remains, the rearrangement should also be illustrated and described in words.
    cite:
      - {section: "9.2.3", page: 65, para: "¶15"}
    examples:
      valid: []
      invalid:
        - text: "46,XX,der(1)t(1;3)(p22;q13.1)t(1;5)(p32;q31)"
          why: >-
            After t(1;3)(p22;q13.1) the derivative no longer has 1p32, so the second translocation
            acts on a derivative in a new rearrangement; the short system can't describe it, the
            detailed system can.
    fix: {level: 3, hint: "Write the derivative in the detailed system (its band composition), e.g. der(1)(5qter→5q31::…)."}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        Severity info (T-056): rearrangements the short system can't express fail its format rules;
        "illustrated and described in words" can't be checked from a string. T-086: reported when
        a short-system derivative's aberration names a band the derivative no longer has after the
        aberrations before it (the composer can't place it); the invalid example is synthetic.
    related: [DER.UNBALANCED_USE_DER, STRUCT.DETAILED_SYSTEM, STRUCT.SHORT_AND_DETAILED_SYSTEMS]
