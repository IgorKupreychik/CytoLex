version: "2016"
section: "16.1"
rules:
  - id: SEQ.SCOPE
    title: Sequence-based nomenclature (seq) combines ISCN and HGVS
    applies_to: [seq]
    severity: info
    statement: >-
      Chromosome rearrangements characterized by sequencing are described by a standard developed
      jointly by ISCN and the Human Genome Variation Society (HGVS): an ISCN-like description of
      the chromosome aberration combined with HGVS-like nucleotide variant descriptions. Only
      aberrant findings are described.
    cite:
      - {section: "16.1", page: 125, para: "¶1"}
      - {section: "16.2", page: 125, para: "¶2"}
    examples:
      valid: []
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        Severity info: the rule defines what the seq notation covers; a string can't show whether
        a normal finding was left out. The parts and their order are SEQ.FORMAT.
    related: [SEQ.FORMAT, SEQ.HGVS_PORTION]
