version: "2016"
section: "4.2"
rules:
  - id: BREAK.INTERFACE_HIGHER_BAND
    title: Break at a band interface goes to the more distal band
    applies_to: [karyotype]
    severity: info
    statement: >-
      A breakpoint is given as the band in which the break lies. A break that seems to lie at
      the interface of two bands is assigned to the band with the higher number, i.e. the one
      farther from the centromere.
    cite:
      - {section: "4.2", page: 40, para: "¶1"}
    examples:
      valid: []
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        Severity info (T-056): a convention for the cytogeneticist assigning breakpoints; a string
        can't show where the break really was.

  - id: BREAK.ALTERNATIVE_BANDS
    title: Two candidate bands or regions joined by or
    applies_to: [karyotype]
    severity: error
    statement: >-
      When a break cannot be placed in one of two bands (typically two adjacent bands, or, if
      only the region is known, two adjacent regions), both are given, joined by the term or;
      the second is written without the chromosome number (1q23 or q24; 1q2 or q3). Section 5.3
      uses or more generally, for any alternative interpretations (UNCERTAIN.OR_ALTERNATIVE).
    cite:
      - {section: "4.2", page: 40, para: "¶2"}
    examples:
      valid:
        - text: "1q23 or q24"
          cite: {section: "4.2", page: 40, para: "¶2"}
        - text: "1q2 or q3"
          cite: {section: "4.2", page: 40, para: "¶2"}
    fix: {level: 3, hint: "Give both candidate bands (or regions) joined by or, the second without the chromosome number."}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        T-010 (2026-11-17): the invalid example "1q21 or q24" (non-adjacent bands) was dropped,
        because §5.3 E1 prints add(19)(p13 or q13) as valid; adjacency is the typical case in
        §4.2, not a requirement.
    related: [BREAK.REGION_ONLY, UNCERTAIN.OR_ALTERNATIVE]

  - id: BREAK.REGION_ONLY
    title: Region-only breakpoints are allowed
    applies_to: [karyotype]
    severity: info
    statement: >-
      A break that can be placed in a region but not in a particular band may be given by the
      region number alone (1p1). A question mark may mark an uncertain localisation (1p1?;
      section 5.1); for the approximate sign see section 5.2.
    cite:
      - {section: "4.2", page: 40, para: "¶2"}
    examples:
      valid:
        - text: "1p1"
          cite: {section: "4.2", page: 40, para: "¶2"}
        - text: "1p1?"
          cite: {section: "4.2", page: 40, para: "¶2"}
    review: {paraphrase_checked: true, needs_review: false}
    related: [BREAK.ALTERNATIVE_BANDS, BREAK.MIXED_RESOLUTION]

  - id: BREAK.MIXED_RESOLUTION
    title: Breakpoints may differ in resolution within one string
    applies_to: [karyotype]
    severity: info
    statement: >-
      Breakpoints in the same rearrangement or karyotype may be given at different levels of
      resolution, according to how precise the karyogram is.
    cite:
      - {section: "4.2", page: 40, para: "¶2"}
    examples:
      valid:
        - text: "46,XX,inv(2)(q11.2q32)"
          cite: {section: "4.3.1.1", page: 41, example: E2}
          note: Sub-band 2q11.2 and band 2q32 in one rearrangement.
    review: {paraphrase_checked: true, needs_review: false}
    related: [BREAK.REGION_ONLY]

  - id: BREAK.NOT_REPEATED_FOR_COPIES
    title: Breakpoints given only at the first appearance
    applies_to: [karyotype]
    severity: info
    statement: >-
      When an extra copy of a rearranged chromosome is present, its breakpoints are given only
      where the rearrangement first appears in the karyotype; later mentions may leave them out.
      Likewise, when one rearrangement gives rise to several derivative chromosomes, its
      breakpoints are not repeated for each derivative.
    cite:
      - {section: "4.2", page: 40, para: "¶3"}
      - {section: "9.2.3", page: 65, para: "¶14"}
    examples:
      valid:
        - text: "48,XX,+1,+der(1)t(1;16)(p13;q13),t(1;16)"
          cite: {section: "4.2", page: 40, para: "¶3"}
        - text: "46,XX,der(2)t(2;5)(q21;q31)mat,+der(2)t(2;5),–5"
          cite: {section: "4.3.2.2", page: 44, float: "Table 4"}
        - text: "46,XX,–2,der(5)t(2;5)(q21;q31)mat,+der(5)t(2;5)"
          cite: {section: "4.3.2.2", page: 44, float: "Table 4"}
        - text: "47,XX,t(9;22)(q34;q11.2),+der(22)t(9;22)"
          cite: {section: "9.2.3", page: 65, example: E35}
        - text: "46,XX,der(1)t(1;3)(p32;q21)inv(1)(p22q21)t(1;11)(q25;q13),der(3)t(1;3),der(11)t(1;11)"
          cite: {section: "9.2.3", page: 65, example: E36}
          note: Balanced complex rearrangement - the t(1;3) and t(1;11) breakpoints given in the der(1) are not repeated for der(3) and der(11).
    review: {paraphrase_checked: true, needs_review: false}
    related: [KARYO.ABBREVIATED_FORM]
