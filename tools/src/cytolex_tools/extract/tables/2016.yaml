# Table and diagram layouts for the ISCN 2016 PDF (T-003). Read by `kb extract`; committed.
#
# The text layer gives every character exactly; only the cell structure is lost. Each table
# region below says where the table sits and where its columns start, so `kb extract` can put
# each word into its cell deterministically. Coordinates are PDF points (y grows downwards),
# measured from the word positions on the page.
#
# Per table:
#   id        float id (`Table 1`) or a name for tables without a caption
#   kind      float: shown under its caption (or under `[<id> p.N]`), not counted as ¶
#             paragraph: counted as ¶n
#             figure: a drawn diagram; its text lines are kept verbatim as `> ` lines
#   review    image: pending|ok|mismatch (rendered table image vs extracted cells)
#             human: pending|ok (checked against the printed book by a person)
#             fallback: none | B1 | B2 | B3 (see docs/extraction-review-2016.md, "Backup plan")
#   regions   one per page part:
#     book_page, top, bottom   lines whose top lies in [top, bottom] belong to the table
#     body_top                 lines above it are header lines (joined per column, top to bottom)
#     header                   auto (from the header lines) | none (no header row in the book)
#     columns                  x0 (pt) where each column starts; a word goes to the last column
#                              starting at or left of it (2 pt tolerance)
#     key                      columns that start a new row when non-empty; other lines are
#                              wrapped continuations of the previous row
#     join                     how wrapped cell lines are joined: text (hyphen-aware) | br

tables:
  - id: Table 1
    kind: float
    review: {image: ok, human: pending, fallback: none}
    regions:
      - book_page: 12
        top: 80
        bottom: 215
        body_top: 110
        header: auto
        columns: [112, 155, 201, 254, 306, 325, 350, 374, 398, 423, 468]
        key: [0]
        join: br
      - book_page: 12
        top: 235
        bottom: 380
        body_top: 265
        header: auto
        columns: [112, 151, 171, 190, 216, 243, 268, 323, 345, 359, 386, 410, 434, 455, 468]
        key: [0]
        join: br

  - id: Table 2
    kind: float
    review: {image: ok, human: pending, fallback: none}
    regions:
      - book_page: 14
        top: 92
        bottom: 325
        body_top: 92
        header: none
        columns: [112, 170]
        key: [0]
        join: text

  - id: Table 3
    kind: float
    review: {image: ok, human: pending, fallback: none}
    regions:
      - book_page: 15
        top: 100
        bottom: 450
        body_top: 140
        header: auto
        columns: [112, 152, 188, 226]
        key: [0, 1, 2]
        join: text

  - id: Table 4
    kind: float
