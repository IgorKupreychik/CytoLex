# Test corpus (T-062): robustness inputs (typed ASCII forms, spacing, letter case, typos, truncation). Format and label policy: tests/data/corpus/README.md.
# Synthetic strings only (data policy T-048); labels trace to the KB rules named in `rules`/`fires`.
format: cytolex-corpus
version: 1
corpus:
  - id: R-001
    iscn: "45,XX,-7[10]/46,XX[10]"
    types: [karyotype]
    features: [typed-form, hyphen-minus]
    rules: [SYM.TYPED_SYMBOL_FORMS]
    source: synthetic
    expected: {"2016": {verdict: valid, context: acquired}}
    review: {checked: false}
  - id: R-002
    iscn: "45,XX,−7[10]/46,XX[10]"
    types: [karyotype]
    features: [typed-form, minus-sign]
    rules: [SYM.TYPED_SYMBOL_FORMS]
    source: synthetic
    expected: {"2016": {verdict: valid, context: acquired}}
    review: {checked: false}
  - id: R-003
    iscn: "46,XY,del(7)(pter->q11.2::q22->qter)"
    types: [karyotype]
    features: [typed-form, arrow]
    rules: [SYM.TYPED_SYMBOL_FORMS, STRUCT.DETAILED_SYSTEM]
    source: synthetic
    expected: {"2016": {verdict: valid, context: constitutional}}
    review: {checked: false}
  - id: R-004
    iscn: "46,XY,t(9;22)(q34;q11.2)[15]/92,XXYY,t(9;22)(q34;q11.2)x2[5]"
