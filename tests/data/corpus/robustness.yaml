  - id: R-019
    iscn: "46,XY,t(9;22)(q34;q11.2)"
    types: [karyotype]
    features: [no-cell-count]
    rules: [CLONE.CELL_COUNT_REQUIRED]
    source: synthetic
    expected: {"2016": {verdict: valid, context: acquired}}
    review: {checked: false, note: "A single karyotype without [n] is never flagged (CLONE.CELL_COUNT_REQUIRED, decided in T-032); the count is required between clones."}
