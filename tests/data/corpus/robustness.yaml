    rules: [SYM.TYPED_SYMBOL_FORMS]
    source: synthetic
    expected: {"2016": {verdict: valid, context: acquired}}
    review: {checked: false}
  - id: R-005
    iscn: "47,XX, +21"
    types: [karyotype]
    features: [spacing]
    rules: []
    source: synthetic
    expected: {"2016": {verdict: invalid, context: constitutional, fires: [SYM.NO_OTHER_SPACE]}}
    review: {checked: false}
  - id: R-006
    iscn: "46, XX"
    types: [karyotype]
    features: [spacing]
    rules: []
    source: synthetic
