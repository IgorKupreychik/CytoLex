    types: [karyotype]
    features: [spacing]
    rules: []
    source: synthetic
    expected: {"2016": {verdict: invalid, context: constitutional, fires: [SYM.SPACE_BEFORE_CHROMOSOME_COUNT]}}
    review: {checked: false}
  - id: R-010
    iscn: "48,XXY c,+8[15]"
    types: [karyotype]
    features: [spacing]
    rules: []
    source: synthetic
    expected: {"2016": {verdict: invalid, context: acquired, fires: [KARYO.CONSTITUTIONAL_C]}}
    review: {checked: false, note: "Same fault as the book's invalid example of KARYO.CONSTITUTIONAL_C (a space before c)."}
  - id: R-011
    iscn: "46,xx"
