version: "2016"
section: "9.2.1"
quotes:
  - rule: ADD.FORMAT
    cite: {section: "9.2.1", page: 59, para: "¶1"}
    text: >-
      The symbol add (Latin, additio) should be used to indicate additional material of unknown
      origin attached to a chromosome region or band. Such abnormalities have often been
      described using the symbols t and ?, e.g., t(1;?)(p36;?), but it is only rarely known that
      the rearranged chromosome has actually resulted from a translocation. The symbol add does
      not imply any particular mechanism and is therefore recommended.
  - rule: ADD.FORMAT
    cite: {section: "9.2.1", page: 59, para: "¶2"}
    text: >-
      Additional material attached to a terminal band will always lead to an increase in length
      of a chromosome arm. Unknown material that replaces a chromosome segment may, depending on
      the size of the extra material, result in either increase or decrease in the length of the
      chromosome arm.
  - rule: ADD.INSERTED_UNKNOWN_USE_INS
    cite: {section: "9.2.1", page: 60, para: "¶4"}
    text: >-
      Unknown material inserted in a chromosome arm should be described by the use of the symbols
      ins and ?.
  - rule: ADD.INSERTED_UNKNOWN_USE_INS
    cite: {section: "9.2.1", page: 60, example: E4}
    text: >-
      Use of the symbol add in this situation, i.e., add(5)(q13), would have denoted that unknown
      material had replaced the segment 5q13qter.
  - rule: DER.MULTIPLE_ABERRATIONS_ONE_CHROMOSOME
    cite: {section: "9.2.1", page: 59, para: "¶3"}
    text: >-
      When additional material of unknown origin is attached to both arms of a chromosome and/ or
      replaces more than one segment in a chromosome, the symbol der (see Section 9.2.3) should
      be used.
  - rule: DER.MULTIPLE_ABERRATIONS_ONE_CHROMOSOME
    cite: {section: "9.2.2", page: 60, para: "¶2"}
    text: >-
      Multiple deletions of the same chromosome should be expressed using the symbol der (see
      Section 9.2.3).
  - rule: DER.MULTIPLE_ABERRATIONS_ONE_CHROMOSOME
    cite: {section: "9.2.3", page: 61, para: "¶4"}
    text: >-
      A derivative chromosome generated by more than one rearrangement within a chromosome is
      specified in parentheses, followed by the type of abnormality. The detailed system is
      helpful in these cases.
  - rule: DER.MULTIPLE_ABERRATIONS_ONE_CHROMOSOME
    cite: {section: "9.2.4", page: 66, para: "¶2"}
    text: >-
      Complex dicentric chromosomes must be described as derivative chromosomes, see Section
      9.2.3.
  - rule: DER.MULTIPLE_ABERRATIONS_ONE_CHROMOSOME
    cite: {section: "9.2.8", page: 68, para: "¶2"}
    text: >-
      When a chromosome contains multiple hsr or one hsr and another structural change, it is by
      definition a derivative chromosome and should be designated accordingly (see Section
      9.2.3).
