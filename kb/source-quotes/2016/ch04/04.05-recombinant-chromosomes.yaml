version: "2016"
section: "4.5"
quotes:
  - rule: REC.DEFINITION
    cite: {section: "4.5", page: 46, para: "¶1"}
    text: >-
      A recombinant chromosome is a structurally rearranged chromosome with a new segmental
      composition resulting from meiotic crossing-over between a displaced segment and its
      normally located counterpart in certain types of structural heterozygotes.
  - rule: REC.DEFINITION
    cite: {section: "4.5", page: 46, para: "¶2"}
    text: >-
      Whereas derivative chromosomes are products of the original rearrangement and segregate at
      meiosis without further change, recombinant chromosomes arise de novo during
      gametogenesis in appropriate structural heterozygotes as predictable consequences of
      crossing-over in a displaced segment.
  - rule: REC.FORMAT
    cite: {section: "4.5", page: 46, para: "¶3"}
    text: >-
      Recombinant chromosomes are designated by the symbol rec. The recombinant chromosome is
      specified in parentheses immediately following the symbol. The chromosome designation used
      is that which indicates the origin of the centromere of the particular recombinant
      chromosome.
  - rule: REC.FORMAT
    cite: {section: "4.5", page: 46, para: "¶4"}
    text: >-
      Note that, in analogy with the nomenclature for derivative chromosomes, the aberrations
      following the designation rec are not separated by a comma.
  - rule: REC.KNOWN_PARENTAL_REARRANGEMENT
    cite: {section: "4.5", page: 46, para: "¶4"}
    text: >-
      The symbol rec should only be used when a parental inversion or insertion has been
      identified. If this is not known, an apparent recombinant chromosome should be written as
      a derivative.
  - rule: REC.DEFINITION
    cite: {section: "9.2.3", page: 60, para: "¶2"}
    text: >-
      A recombinant chromosome (rec) is a structurally rearranged chromosome with a new segmental
      composition resulting from meiotic crossing-over
  - rule: REC.KNOWN_PARENTAL_REARRANGEMENT
    cite: {section: "9.2.3", page: 60, para: "¶2"}
    text: >-
      If parental karyotypes are unknown or a parental inversion has not been identified, the
      abnormal chromosome should be designated as a der, not a rec.
  - rule: REC.KNOWN_PARENTAL_REARRANGEMENT
    cite: {section: "9.2.3", page: 61, para: "¶3"}
    text: >-
      When parental karyotypes are known and a parental inversion or an intra- or
      interchromosomal insertion is identified, rec should be used.
