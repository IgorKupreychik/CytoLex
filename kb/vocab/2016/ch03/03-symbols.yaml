  - label: "parentheses ( )"
    tokens: ["(", ")"]
    pair: {open: "(", close: ")"}
    kind: punctuation
    meanings:
      - text: "Enclose structurally altered chromosomes and their breakpoints."
        sections: ["4.1"]
      - text: "Enclose chromosome numbers, X and Y in normal and abnormal results."
      - text: "Enclose coordinates (or nucleotide positions) in abnormal results."
        sections: ["14.2"]
    cite: {section: "3", page: 35, para: "¶3"}
  - label: "pat"
    tokens: ["pat"]
    kind: abbreviation
    meanings:
      - text: "Paternal origin"
        sections: ["4.1"]
    cite: {section: "3", page: 35, para: "¶3"}
  - label: "pcc"
    tokens: ["pcc"]
    kind: abbreviation
    meanings:
      - text: "Premature chromosome condensation"
        sections: ["10.2.1"]
    cite: {section: "3", page: 35, para: "¶3"}
  - label: "pcd"
    tokens: ["pcd"]
    kind: abbreviation
    meanings:
      - text: "Premature centromere division"
        sections: ["10.2.1"]
    cite: {section: "3", page: 35, para: "¶3"}
  - label: "pcp"
    tokens: ["pcp"]
    kind: abbreviation
    meanings:
      - text: "Partial chromosome paint"
        sections: ["13.8"]
    cite: {section: "3", page: 35, para: "¶3"}
  - label: "period (.)"
    tokens: ["."]
    kind: punctuation
    meanings:
      - text: "Separates the different techniques."
        sections: ["13.2", "14.2", "16.2", "16.3"]
    cite: {section: "3", page: 35, para: "¶3"}
    note: "Same character as 'decimal point (.)'; the position in the string tells them apart."
  - label: "Ph"
    tokens: ["Ph"]
    kind: abbreviation
    meanings:
      - text: "Philadelphia chromosome"
        sections: ["9.2.3"]
    cite: {section: "3", page: 35, para: "¶3"}
  - label: "plus sign, single (+)"
    tokens: ["+"]
    kind: punctuation
    meanings:
      - text: "Additional normal or abnormal chromosome."
        sections: ["4.1", "8.1"]
      - text: "Increase in length."
        sections: ["7.1.1"]
      - text: "A locus present on a particular chromosome."
        sections: ["13.2"]
    cite: {section: "3", page: 36, para: "¶4"}
  - label: "plus sign, double (++)"
    tokens: ["++"]
    kind: punctuation
    meanings:
      - text: "Two hybridization signals or regions on a particular chromosome."
        sections: ["13.2"]
    cite: {section: "3", page: 36, para: "¶4"}
  - label: "pos"
    tokens: ["pos"]
    kind: abbreviation
    meanings:
      - text: "The rearrangement that was tested for is detected."
        sections: ["15.3"]
    cite: {section: "3", page: 36, para: "¶4"}
  - label: "prx"
    tokens: ["prx"]
    kind: abbreviation
    meanings:
      - text: "Proximal"
        sections: ["12.1"]
    cite: {section: "3", page: 36, para: "¶4"}
  - label: "ps"
    tokens: ["ps"]
    kind: abbreviation
    meanings:
      - text: "Short arm carrying satellites."
        sections: ["7.1.1", "7.1.2"]
    cite: {section: "3", page: 36, para: "¶4"}
  - label: "psu"
    tokens: ["psu"]
    kind: abbreviation
    meanings:
      - text: "Pseudo-."
        sections: ["9.2.4"]
    cite: {section: "3", page: 36, para: "¶4"}
  - label: "pter"
    tokens: ["pter"]
    kind: abbreviation
