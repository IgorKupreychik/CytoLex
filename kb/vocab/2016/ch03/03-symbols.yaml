        sections: ["2.3.2"]
    cite: {section: "3", page: 35, para: "¶3"}
  - label: "PI"
    tokens: ["PI"]
    kind: abbreviation
    meanings:
      - text: "First meiotic prophase"
        sections: ["12.1"]
