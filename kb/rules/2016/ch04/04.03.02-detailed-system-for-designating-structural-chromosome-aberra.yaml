version: "2016"
section: "4.3.2"
rules:
  - id: STRUCT.DETAILED_SYSTEM
    title: Detailed system - band composition in the last parentheses
    applies_to: [karyotype]
    severity: error
    statement: >-
      The detailed system keeps every convention of the short system, except that the last
      parentheses hold an abbreviated description of the band composition of the rearranged
      chromosome instead of only its breakpoints. Short and detailed notation may be combined in
      one karyotype, especially for acquired abnormalities.
    cite:
      - {section: "4.3.2", page: 42, para: "¶1"}
    examples:
      valid:
        - text: "46,XX,der(6)(pter→q25.2::p22.2→pter)"
          cite: {section: "9.2.3", page: 61, example: E1}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        Section listed in docs/extraction-review-2016.md because of Fig. 8. The rule does not
        depend on the diagram: Fig. 8 only labels the chromosome ends A–D used in Table 4's
        "Schematic segregants" column, which the KB does not encode.
    related: [STRUCT.SHORT_AND_DETAILED_SYSTEMS, STRUCT.DETAILED_SYMBOLS, STRUCT.COMPOSITION_ORDER]
