version: "2016"
section: "4.3.1.1"
rules:
  - id: STRUCT.SHORT_ARM_BREAKPOINT_FIRST
    title: Short-arm breakpoint before long-arm breakpoint
    applies_to: [karyotype]
    severity: error
    statement: >-
      In a two-break rearrangement of one chromosome with a break in each arm, the short-arm (p)
      breakpoint is given before the long-arm (q) breakpoint.
    cite:
      - {section: "4.3.1.1", page: 41, para: "¶1"}
    examples:
      valid:
        - text: "46,XX,inv(2)(p21q31)"
          cite: {section: "4.3.1.1", page: 41, example: E1}
      invalid:
        - text: "46,XX,inv(2)(q31p21)"
          why: The long-arm breakpoint q31 is given before the short-arm breakpoint p21.
          corrected: "46,XX,inv(2)(p21q31)"
    fix: {level: 1, kind: reorder, hint: Put the short-arm breakpoint first.}
    review: {paraphrase_checked: true, needs_review: false}
    related: [STRUCT.PROXIMAL_BREAKPOINT_FIRST]

  - id: STRUCT.PROXIMAL_BREAKPOINT_FIRST
    title: Same arm - proximal breakpoint first
    applies_to: [karyotype]
    severity: error
    statement: >-
      When both breaks of a two-break rearrangement lie in the same arm, the breakpoint nearer
      the centromere is given first.
    cite:
      - {section: "4.3.1.1", page: 41, para: "¶2"}
    examples:
      valid:
        - text: "46,XX,inv(2)(p13p23)"
          cite: {section: "4.3.1.1", page: 41, example: E2}
        - text: "46,XX,inv(2)(q11.2q32)"
          cite: {section: "4.3.1.1", page: 41, example: E2}
      invalid:
        - text: "46,XX,inv(2)(p23p13)"
          why: 2p13 is nearer the centromere than 2p23 and must be given first.
          corrected: "46,XX,inv(2)(p13p23)"
    fix: {level: 1, kind: reorder, hint: Put the breakpoint nearer the centromere first.}
    review: {paraphrase_checked: true, needs_review: false}
    related: [STRUCT.SHORT_ARM_BREAKPOINT_FIRST]
