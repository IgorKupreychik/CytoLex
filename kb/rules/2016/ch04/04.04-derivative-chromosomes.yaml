version: "2016"
section: "4.4"
rules:
  - id: DER.DEFINITION
    title: What a derivative chromosome is
    applies_to: [karyotype]
    severity: info
    statement: >-
      A derivative chromosome is a structurally rearranged chromosome produced either by more
      than one rearrangement within one chromosome (e.g. an inversion plus a deletion, or
      deletions in both arms) or by a rearrangement involving two or more chromosomes (e.g. an
      unbalanced translocation product). An abnormal chromosome of which no part can be
      identified is a marker chromosome (mar, section 9.2.12), not a derivative.
    cite:
      - {section: "4.4", page: 44, para: "¶1"}
      - {section: "9.2.3", page: 60, para: "¶1"}
    examples:
      valid: []
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        Section listed in docs/extraction-review-2016.md because of Fig. 8/9; the text is
        complete in the chunk and does not depend on the diagrams.
    related: [DER.CENTROMERE_CHROMOSOME, DER.UNBALANCED_USE_DER]

  - id: DER.CENTROMERE_CHROMOSOME
    title: der(n) names the chromosome with the centromere
    applies_to: [karyotype]
    severity: error
    statement: >-
      A derivative chromosome is written der, followed in parentheses by the chromosome that
      supplies its intact centromere (or neocentromere, section 9.2.13).
    cite:
      - {section: "4.4", page: 44, para: "¶2"}
      - {section: "4.4", page: 45, para: "¶3"}
      - {section: "9.2.3", page: 60, para: "¶1"}
      - {section: "9.2.3", page: 61, para: "¶5"}
    examples:
      valid:
        - text: "46,XX,der(5)t(2;5)(q21;q31)mat"
          cite: {section: "4.3.2.2", page: 44, float: "Table 4"}
        - text: "46,XX,der(2)t(2;5)(q21;q31)mat"
          cite: {section: "4.3.2.2", page: 44, float: "Table 4"}
        - text: "45,XX,der(2)t(2;5)(q21;q31)mat,–5"
          cite: {section: "4.3.2.2", page: 44, float: "Table 4"}
        - text: "45,XX,–2,der(5)t(2;5)(q21;q31)mat"
          cite: {section: "4.3.2.2", page: 44, float: "Table 4"}
        - text: "46,XX,t(2;5)(q21;q31)"
          cite: {section: "4.4", page: 45, para: "¶3"}
          note: The balanced parental translocation whose derivatives are der(2) and der(5).
        - text: "46,Y,der(X)t(X;8)(p22.3;q24.1)"
          cite: {section: "9.2.3", page: 61, example: E9}
        - text: "46,XX,der(1)t(1;3)(p22;q13.1)"
          cite: {section: "9.2.3", page: 61, example: E10}
        - text: "46,XX,der(1)(3qter→3q13.1::1p22→1qter)"
          cite: {section: "9.2.3", page: 61, example: E10}
        - text: "45,XY,der(1)t(1;3)(p22;q13.1),–3"
          cite: {section: "9.2.3", page: 62, example: E11}
        - text: "47,XY,+mos der(8)r(1;8;17)(p36.3p35;p12q13;q25q25)"
          cite: {section: "9.2.3", page: 62, example: E17}
          note: A ring of three chromosome segments; it is der(8) because it keeps the chromosome 8 centromere. Printed as +mos der(8).
        - text: "47,XY,+mos der(8)r(1;8;17)(::1p36.3→1p35::8p12→8q13::17q25→17q25::)"
          cite: {section: "9.2.3", page: 62, example: E17}
      invalid:
        - text: "46,XX,der(5)(2pter→2q21::5q31→5qter)"
          why: The chromosome contains the centromere of chromosome 2 (2pter→2q21), so it is der(2).
          corrected: "46,XX,der(2)(2pter→2q21::5q31→5qter)"
    fix: {level: 1, kind: replace, hint: Name the derivative after the chromosome whose centromere it contains.}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        ¶3 refers to Fig. 8 (pachytene diagram); the karyotype strings and their meaning are in
        the text and Table 4 (signed off 2026-11-17), so the rule does not depend on the
        diagram.
    related: [DER.ABERRATIONS_NO_COMMA, DER.ABERRATION_ORDER]

  - id: DER.ABERRATIONS_NO_COMMA
    title: No comma between the aberrations of one derivative
    applies_to: [karyotype]
    severity: error
    statement: >-
      All aberrations that produced the derivative chromosome are written directly after der(n),
      with no comma between them.
    cite:
      - {section: "4.4", page: 44, para: "¶2"}
      - {section: "4.3.2.2", page: 43, para: "¶1"}
      - {section: "9.2.3", page: 62, para: "¶7"}
    examples:
      valid:
        - text: "der(1)t(1;3)(p32;q21)t(1;11)(q25;q13)"
          cite: {section: "4.4", page: 44, para: "¶2"}
        - text: "46,XX,der(1)t(1;3)(p32;q21)t(1;11)(q25;q13)"
          cite: {section: "9.2.3", page: 62, example: E12}
      invalid:
        - text: "46,XX,der(1)t(1;3)(p32;q21),t(1;11)(q25;q13)"
          why: The comma splits the derivative's second translocation off as a separate abnormality.
          corrected: "46,XX,der(1)t(1;3)(p32;q21)t(1;11)(q25;q13)"
    fix: {level: 1, kind: delete, hint: Remove the comma between the aberrations of the derivative chromosome.}
    review: {paraphrase_checked: true, needs_review: false}
    related: [DER.ABERRATION_ORDER, REC.FORMAT]

  - id: DER.ABERRATION_ORDER
    title: Derivative's aberrations ordered by breakpoint, pter to qter
    applies_to: [karyotype]
    severity: error
    statement: >-
      The aberrations of a derivative chromosome are listed in the order of their breakpoints
      along the derivative, from pter to qter.
    cite:
      - {section: "4.4", page: 44, para: "¶2"}
      - {section: "4.3.2.2", page: 43, para: "¶1"}
      - {section: "6", page: 50, example: E8}
      - {section: "9.2.3", page: 62, para: "¶7"}
    examples:
      valid:
        - text: "der(1)t(1;3)(p32;q21)t(1;11)(q25;q13)"
          cite: {section: "4.4", page: 44, para: "¶2"}
        - text: "46,XX,der(8)ins(8;?)(p23;?)del(8)(q22)"
          cite: {section: "6", page: 50, example: E8}
          note: Distal p arm to distal q arm, not alphabetical (ORDER.HOMOLOGUES_ALPHABETICAL).
        - text: "46,XX,der(1)t(1;3)(p32;q21)t(1;11)(q25;q13)"
          cite: {section: "9.2.3", page: 62, example: E12}
        - text: "46,XX,der(1)(3qter→3q21::1p32→1q25::11q13→11qter)"
          cite: {section: "9.2.3", page: 62, example: E12}
        - text: "46,XY,der(1)t(1;3)(p32;q21)t(3;7)(q28;q11.2)"
          cite: {section: "9.2.3", page: 62, example: E13}
          note: The second translocation joins 7q11.2qter onto the chromosome 3 segment, at its distal end.
        - text: "46,XY,der(1)(7qter→7q11.2::3q28→3q21::1p32→1qter)"
          cite: {section: "9.2.3", page: 62, example: E13}
        - text: "46,XY,der(1)t(1;3)(p32;q21)dup(1)(q25q42)"
          cite: {section: "9.2.3", page: 62, example: E14}
        - text: "46,XY,der(1)(3qter→3q21::1p32→1q42::1q25→1qter)"
          cite: {section: "9.2.3", page: 62, example: E14}
        - text: "46,XY,der(9)del(9)(p12)t(9;13)(q34;q11)"
          cite: {section: "9.2.3", page: 62, example: E15}
        - text: "46,XY,der(9)(:9p12→9q34::13q11→13qter)"
          cite: {section: "9.2.3", page: 62, example: E15}
        - text: "46,XX,der(1)t(1;11)(p32;q13)t(1;3)(q25;q21)"
          cite: {section: "9.2.3", page: 62, example: E16}
          note: Listed by the 1p32 and 1q25 breakpoints, so t(1;11) comes before t(1;3).
        - text: "46,XX,der(1)(11qter→11q13::1p32→1q25::3q21→3qter)"
          cite: {section: "9.2.3", page: 62, example: E16}
        - text: "46,XX,der(8)t(8;17)(p23;q21)inv(8)(p22q13)t(8;22)(q22;q12)"
          cite: {section: "9.2.3", page: 63, example: E20}
        - text: "46,XX,der(8)(22qter→22q12::8q22→8q13::8p22→8q13::8p22→8p23::17q21→17qter)"
          cite: {section: "9.2.3", page: 63, example: E20}
      invalid:
        - text: "46,XX,der(1)t(1;11)(q25;q13)t(1;3)(p32;q21)"
          why: The 1p32 translocation is nearer pter than the 1q25 one and must be listed first.
          corrected: "46,XX,der(1)t(1;3)(p32;q21)t(1;11)(q25;q13)"
    fix: {level: 1, kind: reorder, hint: "Order the aberrations by their breakpoints on the derivative, from pter to qter."}
    review: {paraphrase_checked: true, needs_review: false}
    related: [DER.ABERRATIONS_NO_COMMA, ORDER.HOMOLOGUES_ALPHABETICAL]
