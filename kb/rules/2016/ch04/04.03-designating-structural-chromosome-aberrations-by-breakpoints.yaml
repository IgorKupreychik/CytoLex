version: "2016"
section: "4.3"
rules:
  - id: STRUCT.SHORT_AND_DETAILED_SYSTEMS
    title: Short system (breakpoints) and detailed system (band composition)
    applies_to: [karyotype]
    severity: info
    statement: >-
      Structural abnormalities can be written in two systems. The short system gives the type of
      rearrangement and its breakpoints (bands or regions); the band composition of the abnormal
      chromosome follows from its conventions. The detailed system also gives the band
      composition of each abnormal chromosome. Both use the same rearrangement notation and the
      same way of specifying breakpoints. For very complex abnormalities the short system may be
      inadequate or ambiguous.
    cite:
      - {section: "4.3", page: 40, para: "¶1"}
      - {section: "9.2", page: 59, para: "¶1"}
    examples:
      valid: []
    review: {paraphrase_checked: true, needs_review: false}
    related: [STRUCT.BREAKPOINT_GROUPS, STRUCT.DETAILED_SYSTEM]

  - id: GEN.GENOME_BUILD_REQUIRED
    title: Genome build required with nucleotide positions
    applies_to: [arr, rsa, seq]
    severity: error
    statement: >-
      When an aberration is given by nucleotide positions (microarray, region-specific assay or
      sequencing), the genome build or assembly must be stated (sections 14.1, 15.1, 16.2).
    cite:
      - {section: "4.3", page: 41, para: "¶2"}
    examples:
      valid:
        - text: "arr[GRCh38] Xp22.33q28(168546_155233730)×1[0.6]"
          cite: {section: "14.2", page: 116, example: E2}
      invalid:
        - text: "arr Xp22.33q28(168546_155233730)×1[0.6]"
          why: Nucleotide positions are given without the genome build (e.g. [GRCh38]).
    fix: {level: 3, hint: "Add the genome build in square brackets (e.g. arr[GRCh38])."}
    review: {paraphrase_checked: true, needs_review: false}
