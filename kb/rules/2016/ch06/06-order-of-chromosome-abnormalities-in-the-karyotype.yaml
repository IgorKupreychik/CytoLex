version: "2016"
section: "6"
rules:
  - id: ORDER.X_BEFORE_Y
    title: X chromosome abnormalities before Y abnormalities
    applies_to: [karyotype]
    severity: error
    statement: >-
      Among the sex chromosome abnormalities, which come before all autosomal ones, those of the
      X chromosome are listed before those of the Y chromosome.
    cite:
      - {section: "6", page: 50, para: "¶1"}
    examples:
      valid:
        - text: "50,X,+X,–Y,+10,+14,+17,+21[5]/46,XY[15]"
          cite: {section: "6", page: 50, example: E1}
        - text: "47,Y,t(X;13)(q27;q12),inv(10)(p13q22),+21"
          cite: {section: "6", page: 50, example: E3}
        - text: "46,t(X;18)(p11.1;q11.2),t(Y;1)(q11.2;p13)"
          cite: {section: "6", page: 50, example: E4}
        - text: "48,X,t(Y;12)(q11.2;p12),del(6)(q11),+8,t(9;22)(q34;q11.2),+17,–21,+22"
          cite: {section: "6", page: 50, example: E5}
      invalid:
        - text: "50,X,–Y,+X,+10,+14,+17,+21[5]/46,XY[15]"
          why: The loss of the Y is listed before the gain of an X.
          corrected: "50,X,+X,–Y,+10,+14,+17,+21[5]/46,XY[15]"
    fix: {level: 1, kind: reorder, hint: List the X chromosome abnormalities before those of the Y.}
    review: {paraphrase_checked: true, needs_review: false}
    related: [KARYO.ABNORMALITY_ORDER]

  - id: ORDER.NUMERICAL_BEFORE_STRUCTURAL
    title: Per chromosome, numerical change before structural changes
    applies_to: [karyotype]
    severity: error
    statement: >-
      Within the abnormalities of one chromosome, a numerical change is listed before the
      structural ones (+3 before inv(3); –20 before del(20)).
    cite:
      - {section: "6", page: 50, para: "¶1"}
    examples:
      valid:
        - text: "49,X,inv(X)(p21q26),+3,inv(3)(q21q26.2),+7,+10,–20,del(20)(q11.2),+21"
          cite: {section: "6", page: 50, example: E6}
        - text: "50,XX,+1,+del(1)(p13),+dup(1)(q21q32),+inv(1)(p31q41),+8,r(10)(p12q25),–21"
          cite: {section: "6", page: 50, example: E7}
      invalid:
        - text: "49,X,inv(X)(p21q26),inv(3)(q21q26.2),+3,+7,+10,del(20)(q11.2),–20,+21"
          why: For chromosomes 3 and 20 the structural change is listed before the numerical one.
          corrected: "49,X,inv(X)(p21q26),+3,inv(3)(q21q26.2),+7,+10,–20,del(20)(q11.2),+21"
    fix: {level: 1, kind: reorder, hint: "For each chromosome, list the numerical change before its structural changes."}
    review: {paraphrase_checked: true, needs_review: false}
    related: [KARYO.ABNORMALITY_ORDER, ORDER.HOMOLOGUES_ALPHABETICAL]

  - id: ORDER.HOMOLOGUES_ALPHABETICAL
    title: Structural changes of homologues in alphabetical order
    applies_to: [karyotype]
    severity: error
    statement: >-
      When several homologues of one chromosome carry separate structural changes, these are
      listed in alphabetical order of their abbreviations (del, dup, inv, …). This does not apply
      to aberrations on one and the same derivative chromosome, which are listed from the distal
      short arm to the distal long arm (DER.ABERRATION_ORDER).
    cite:
      - {section: "6", page: 50, para: "¶1"}
      - {section: "6", page: 50, example: E8}
    examples:
      valid:
        - text: "50,XX,+1,+del(1)(p13),+dup(1)(q21q32),+inv(1)(p31q41),+8,r(10)(p12q25),–21"
          cite: {section: "6", page: 50, example: E7}
        - text: "46,XX,der(8)ins(8;?)(p23;?)del(8)(q22)"
          cite: {section: "6", page: 50, example: E8}
          note: One derivative chromosome 8, so pter→qter order rather than alphabetical.
      invalid:
        - text: "50,XX,+1,+inv(1)(p31q41),+del(1)(p13),+dup(1)(q21q32),+8,r(10)(p12q25),–21"
          why: inv(1) is listed before del(1) and dup(1); the order is alphabetical.
          corrected: "50,XX,+1,+del(1)(p13),+dup(1)(q21q32),+inv(1)(p31q41),+8,r(10)(p12q25),–21"
    fix: {level: 1, kind: reorder, hint: Sort the structural changes of the homologues alphabetically by abbreviation.}
    review: {paraphrase_checked: true, needs_review: false}
    related: [ORDER.NUMERICAL_BEFORE_STRUCTURAL, DER.ABERRATION_ORDER]

  - id: ORDER.UNIDENTIFIED_LAST
    title: Unidentified r, then mar, then dmin, at the end
    applies_to: [karyotype]
    severity: error
    statement: >-
      Unidentified ring chromosomes (r), marker chromosomes (mar) and double minutes (dmin) come
      after all other abnormalities, in that order.
    cite:
      - {section: "6", page: 51, para: "¶2"}
    examples:
      valid:
        - text: "52,XX,…,+r,+mar,12~20dmin"
          cite: {section: "6", page: 51, example: E9}
          note: Partial string as printed; … stands for the omitted abnormalities.
      invalid:
        - text: "52,XX,…,+mar,+r,12~20dmin"
          why: The marker is listed before the unidentified ring.
          corrected: "52,XX,…,+r,+mar,12~20dmin"
    fix: {level: 1, kind: reorder, hint: "Move unidentified r, mar and dmin to the end, in that order."}
    review: {paraphrase_checked: true, needs_review: false}
    related: [ORDER.UNKNOWN_CENTROMERE_DER, UNCERTAIN.INC_AT_END]

  - id: ORDER.UNKNOWN_CENTROMERE_DER
    title: der(?) after identified abnormalities, before r/mar/dmin
    applies_to: [karyotype]
    severity: error
    statement: >-
      A derivative chromosome whose centromere is unknown (der(?)) follows all identified
      abnormalities and precedes any unidentified ring, marker and double minute chromosomes.
    cite:
      - {section: "6", page: 51, para: "¶3"}
    examples:
      valid:
        - text: "52,XX,…,+der(?)t(?;6)(?;q16),+r,+mar,5~9dmin"
          cite: {section: "6", page: 51, example: E10}
          note: Partial string as printed; … stands for the omitted abnormalities.
      invalid:
        - text: "52,XX,…,+r,+der(?)t(?;6)(?;q16),+mar,5~9dmin"
          why: The der(?) is listed after the unidentified ring.
          corrected: "52,XX,…,+der(?)t(?;6)(?;q16),+r,+mar,5~9dmin"
    fix: {level: 1, kind: reorder, hint: "Place der(?) after the identified abnormalities and before r, mar and dmin."}
    review: {paraphrase_checked: true, needs_review: false}
    related: [ORDER.UNIDENTIFIED_LAST, UNCERTAIN.QUESTION_MARK_DESIGNATION]

  - id: ORDER.SHORTEST_STRING_PREFERRED
    title: Prefer the shortest equivalent string
    applies_to: [karyotype]
    severity: info
    statement: >-
      When a karyotype has an extra copy of a chromosome and a structural change of that
      chromosome, writing the changed chromosome as the gain (+inv(3)(q21q26.2)) describes the
      same chromosome complement as a gain plus a separate change (+3,inv(3)(q21q26.2)), and is
      preferred because the string is shorter.
    cite:
      - {section: "6", page: 50, example: E6}
    examples:
      valid:
        - text: "49,X,inv(X)(p21q26),+inv(3)(q21q26.2),+7,+10,–20,del(20)(q11.2),+21"
          cite: {section: "6", page: 50, example: E6}
          note: The preferred form given in the note to E6.
        - text: "49,X,inv(X)(p21q26),+3,inv(3)(q21q26.2),+7,+10,–20,del(20)(q11.2),+21"
          cite: {section: "6", page: 50, example: E6}
          note: Also correct, but longer.
    fix: {level: 3, hint: "Where an extra chromosome carries the structural change, write it as +change instead of +n plus the change."}
    review:
      paraphrase_checked: true
      needs_review: true
      note: >-
        The book states the preference only in the note to one example (in E7 every changed
        chromosome 1 is itself a gain, so there is no shorter form). Whether +n plus a
        structural change of chromosome n should get an info hint, and how to tell such cases
        apart, is for T-022.
    related: [ORDER.NUMERICAL_BEFORE_STRUCTURAL]
