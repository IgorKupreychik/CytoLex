version: "2016"
section: "2.4"
rules:
  - id: BAND.RESOLUTION_LEVELS
    title: Resolution levels 300–850 bands
    applies_to: [general]
    severity: info
    statement: >-
      The resolution level is the number of bands seen in a haploid set (22 autosomes plus X and
      Y). The standard idiograms (Fig. 5) show about 300, 400, 550, 700 and 850 bands.
    cite:
      - {section: "2.4", page: 12, para: "¶2"}
      - {section: "2.5", page: 16, float: "Fig. 5"}
    examples:
      valid: []
    review: {paraphrase_checked: true, needs_review: false}
    related: [BAND.MUST_EXIST]

  - id: BAND.NUMBERING_SAME_ALL_STAINS
    title: Same band numbers for G-, Q- and R-banding
    applies_to: [general]
    severity: info
    statement: >-
      The idiograms are drawn as G-band patterns but give the band positions for G-, Q- and
      R-stained preparations alike: G- and R-bands may look different, but the order of the bands
      is the same, so band names do not depend on the staining technique.
    cite:
      - {section: "2.4", page: 13, para: "¶3"}
      - {section: "2.5", page: 16, float: "Fig. 5"}
    examples:
      valid: []
    review: {paraphrase_checked: true, needs_review: false}

  - id: BAND.MUST_EXIST
    title: Band must exist in the ISCN idiograms
    applies_to: [general]
    severity: error
    statement: >-
      A band or sub-band name must be one defined by the ISCN idiograms (Fig. 5) at one of the
      standard resolution levels. Besides these, p10 and q10 (the centromere) are valid. The
      list of valid names is kb/bands/2016/bands.yaml (the book's idiograms, checked against
      NCBI, with cited exceptions). Names found only in the genome assemblies are accepted
      with a note (BAND.GENOME_ASSEMBLY_ONLY).
    cite:
      - {section: "2.4", page: 12, para: "¶2"}
      - {section: "2.5", page: 16, float: "Fig. 5"}
    examples:
      valid:
        - text: "9q34.1"
          note: Not a book example in this section; 400/550-level sub-band.
        - text: "9q34.11"
          note: >-
            Not in the book's idiograms, but kept from NCBI with book: false
            (kb/bands/2016/exceptions.yaml; §15.3 uses it). Accepted here; the info note comes
            from BAND.GENOME_ASSEMBLY_ONLY.
      invalid:
        - text: "9q35"
          why: Chromosome 9 has no band q35; its long arm ends at region 3, band 4.
        - text: "9q34.4"
          why: Band 9q34 has only sub-bands 9q34.1–9q34.3.
        - text: "arr[GRCh38] 9p24.3(1310386_1709409)×1 mat,9p22.3p22.2(16455330_16763471)×1 dn,18q22.33q22.1(62747805_67920791)×1 dn"
          cite: {section: "14.2", page: 119, example: E27}
          why: >-
            Printed error in the book: band 18q22.33 does not exist (18q22 has sub-bands
            18q22.1–18q22.3). The positions lie in 18q21.33–18q22.1, the range §14.2 E29 prints
            for a nearby region.
          corrected: "arr[GRCh38] 9p24.3(1310386_1709409)×1 mat,9p22.3p22.2(16455330_16763471)×1 dn,18q21.33q22.1(62747805_67920791)×1 dn"
        - text: "arr[GRCh38] 15q11.2q26.3(23123715_101888908)×2 hmz pat,21q11.21q22.3(14595263_48084819)×2 hmz pat"
          cite: {section: "14.2.1", page: 121, example: E4}
          why: >-
            Printed error in the book: band 21q11.21 does not exist (21q11.2 has no sub-bands).
            The start position 14595263 lies in 21q11.2. §14.2.1 E5 repeats it in the long form.
          corrected: "arr[GRCh38] 15q11.2q26.3(23123715_101888908)×2 hmz pat,21q11.2q22.3(14595263_48084819)×2 hmz pat"
    fix: {level: 3, hint: "Name an existing band; check the idiogram of the chromosome at the resolution level used."}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        §14.2 E27 (T-017, decided with the user): the printed 18q22.33q22.1 is a misprint. The
        printed string is kept here as an invalid example; ARR.ABERRATION_ORDER holds the
        corrected form as its valid example. §14.2.1 E4/E5 (T-034, decided with the user): the
        printed 21q11.21 is a misprint, treated the same way; ARR.ZYGOSITY holds the corrected
        forms.
    related: [BAND.CENTROMERE_10, BAND.RESOLUTION_LEVELS, BAND.GENOME_ASSEMBLY_ONLY]

  - id: BAND.GENOME_ASSEMBLY_ONLY
    title: Band from the genome assemblies, not in the idiograms
    applies_to: [karyotype, breakage, meiotic, ish, nuc_ish, fib_ish, rev_ish]
    severity: info
    statement: >-
      The band names the book defines are those of the idiograms (Fig. 5). A few names are
      bands of the GRCh37/GRCh38 genome assemblies (NCBI) but do not appear in the idiograms
      (book: false in kb/bands/2016/bands.yaml, e.g. 9q34.11). In a karyotype or in situ
      hybridization string such a name is accepted with a note naming its source; array and
      sequence strings, which describe genome bands, get no note.
    cite:
      - {section: "2.4", page: 12, para: "¶2"}
      - {section: "2.5", page: 16, float: "Fig. 5"}
    examples:
      valid:
        - text: "9q34.1"
          note: Not a book example in this section; a band of the idiograms, so no note.
      invalid:
        - text: "9q34.11"
          why: >-
            Not in the ISCN 2016 idiograms; a band of the genome assemblies (NCBI). Accepted,
            with an info note naming the source.
    review:
      paraphrase_checked: false
      needs_review: false
      note: >-
        Not book text: the info note is a project decision (T-007 kept the six NCBI-only names
        6p24.1–3 and 9q34.11–13 because §15.3 uses 9q34.11; T-022 set info in karyotype/ish and
        nothing in arr/seq; T-029 made it a rule of its own). The citations give the idiograms
        as the book's band list.
    related: [BAND.MUST_EXIST]

  - id: BAND.PERICENTROMERIC_11
    title: Bands next to the centromere are 11, 11.1 or 11.11
    applies_to: [general]
    severity: info
    statement: >-
      The heterochromatic regions on either side of the centromere (band 10) are numbered 11,
      11.1 or 11.11, depending on the resolution level.
    cite:
      - {section: "2.4", page: 14, para: "¶5"}
    examples:
      valid:
        - text: "1p11"
          note: Not a book example in this section.
        - text: "1p11.1"
          note: Not a book example in this section.
    review: {paraphrase_checked: true, needs_review: false}
    related: [BAND.CENTROMERE_10]

  - id: BAND.VARIABLE_REGIONS
    title: Variable regions are not detailed in the idiograms
    applies_to: [general]
    severity: info
    statement: >-
      Two kinds of variable regions are cross-hatched in the idiograms: the pericentromeric
      heterochromatin of every chromosome, and 1q12, 3q11.2, 9q12, 16q11.2, 19p12, 19q12, Yq12
      and the short arms of the acrocentric chromosomes. They are drawn schematically, and bands
      inside them are not shown because they vary (see chapter 7).
    cite:
      - {section: "2.4", page: 13, para: "¶4"}
    examples:
      valid: []
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        Severity info (T-056): describes how the idiograms draw variable regions; nothing to violate
        in a string.
