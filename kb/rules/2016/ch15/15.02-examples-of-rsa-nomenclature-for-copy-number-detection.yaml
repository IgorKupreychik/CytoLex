version: "2016"
section: "15.2"
rules:
  - id: RSA.FORMAT
    title: "Copy number by rsa: rsa(chromosomes)×n or rsa[build] region(…)×n"
    applies_to: [rsa]
    severity: error
    statement: >-
      A region-specific assay result begins with rsa. Whole chromosomes are written as a
      chromosome list in parentheses followed by the copy number (×n), directly after rsa; groups
      with different copy numbers are separated by commas, each with its own parentheses and
      copy number (rsa(13,18)×2,(21)×3,(X,Y)×1). A region is written after rsa and a space as the
      band followed by the nucleotide span, kit, locus or gene in parentheses and the copy
      number; with nucleotide numbers the genome build stands in square brackets directly after
      rsa (rsa[GRCh38] 1p36.33(849466_2432509)×1).
    cite:
      - {section: "15.1", page: 123, para: "¶1"}
      - {section: "15.2", page: 123, example: E1}
      - {section: "15.2", page: 124, example: E8}
    examples:
      valid:
        - text: "46,XX.rsa(13,18,21,X)×2"
          cite: {section: "15.2", page: 123, example: E1}
          note: Combined with a karyotype; normal result.
        - text: "rsa(13,18,21)×2,(X,Y)×1"
          cite: {section: "15.2", page: 123, example: E2}
        - text: "rsa(13,18)×2,(21)×3,(X,Y)×1"
          cite: {section: "15.2", page: 123, example: E3}
        - text: "rsa(13,18)×2,(21)×3,(X)×2"
          cite: {section: "15.2", page: 123, example: E4}
        - text: "rsa(13,18,21)×2,(X)×1"
          cite: {section: "15.2", page: 124, example: E5}
        - text: "rsa(13,18,21)×2,(X)×2,(Y)×1"
          cite: {section: "15.2", page: 124, example: E6}
        - text: "rsa(21)×3,(X)×2,(Y)×1"
          cite: {section: "15.2", page: 124, example: E7}
        - text: "rsa[GRCh38] 1p36.33(849466_2432509)×1"
          cite: {section: "15.2", page: 124, example: E8}
        - text: "rsa 22q11.21(HIRA)×1"
          cite: {section: "15.2", page: 124, example: E12}
      invalid:
        - text: "rsa(13,18)×2,(21)3,(X,Y)×1"
          why: The copy number of (21) has no multiplication sign (×3).
          corrected: "rsa(13,18)×2,(21)×3,(X,Y)×1"
        - text: "rsa22q11.21(HIRA)×1"
          why: A region result needs a space between rsa and the band.
          corrected: "rsa 22q11.21(HIRA)×1"
    fix: {level: 3, hint: "Write rsa(chromosomes)×n for whole chromosomes, or rsa, a space, the band, the span or locus in parentheses and ×n."}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        §15.1 states the parts (rsa, the underscore span, the build); the layout is taken from
        the §15.2 examples, which all follow it (the space after rsa before a band as in arr,
        none before a chromosome list). Both invalid examples are inferred.
    related: [RSA.SCOPE, RSA.KIT_OR_LOCUS, RSA.NORMAL_LOCI_OPTIONAL, GEN.GENOME_BUILD_REQUIRED, ARR.NUCLEOTIDE_FORMAT, ARR.ABERRATION_ORDER]
