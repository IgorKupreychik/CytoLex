version: "2016"
section: "9.2.4"
rules:
  - id: DIC.FORMAT
    title: dic and idic for dicentric chromosomes
    applies_to: [karyotype]
    severity: error
    statement: >-
      A dicentric chromosome is written dic(chromosome;chromosome)(breakpoint;breakpoint), an
      isodicentric one idic(chromosome)(breakpoint). A dicentric counts as one chromosome, and
      the symbol shows that it replaces one or two normal chromosomes, which are not written as
      missing. A dicentric formed from sister chromatids may be written dic(13)(q14q32).
    cite:
      - {section: "9.2.4", page: 65, para: "¶1"}
      - {section: "9.2.4", page: 65, example: E1}
    examples:
      valid:
        - text: "45,XX,dic(13;13)(q14;q32)"
          cite: {section: "9.2.4", page: 65, example: E1}
        - text: "45,XX,dic(13;13)(13pter→13q14::13q32→13pter)"
          cite: {section: "9.2.4", page: 65, example: E1}
        - text: "dic(13)(q14q32)"
          cite: {section: "9.2.4", page: 65, example: E1}
          note: Fragment from the E1 explanation (sister-chromatid origin).
        - text: "45,XX,dic(13;15)(q22;q24)"
          cite: {section: "9.2.4", page: 65, example: E2}
        - text: "45,XX,dic(13;15)(13pter→13q22::15q24→15pter)"
          cite: {section: "9.2.4", page: 65, example: E2}
        - text: "46,XX,+13,dic(13;15)(q22;q24)"
          cite: {section: "9.2.4", page: 65, example: E3}
        - text: "45,XY,dic(14;21)(p11.2;p11.2)"
          cite: {section: "9.2.4", page: 66, example: E4}
        - text: "45,XY,dic(14;21)(14qter→14p11.2::21p11.2→21qter)"
          cite: {section: "9.2.4", page: 66, example: E4}
        - text: "47,XY,+dic(17;?)(q22;?)"
          cite: {section: "9.2.4", page: 66, example: E5}
        - text: "47,XY,+dic(17;?)(17pter→17q22::?)"
          cite: {section: "9.2.4", page: 66, example: E5}
        - text: "46,X,idic(Y)(q12)"
          cite: {section: "9.2.4", page: 66, example: E6}
        - text: "46,X,idic(Y)(pter→q12::q12→pter)"
          cite: {section: "9.2.4", page: 66, example: E6}
        - text: "46,XX,idic(21)(q22.3)"
          cite: {section: "9.2.4", page: 66, example: E7}
          note: The idic replaces one chromosome 21; the normal 21 is not written with + although the long arm is present three times.
        - text: "46,XX,idic(21)(pter→q22.3::q22.3→pter)"
          cite: {section: "9.2.4", page: 66, example: E7}
        - text: "47,XX,+idic(13)(q22)"
          cite: {section: "9.2.4", page: 66, example: E8}
        - text: "47,XX,+idic(13)(pter→q22::q22→pter)"
          cite: {section: "9.2.4", page: 66, example: E8}
        - text: "47,XY,+idic(15)(q12)"
          cite: {section: "9.2.4", page: 66, example: E9}
        - text: "47,XY,+dic(15;15)(q12;q12)"
          cite: {section: "9.2.4", page: 66, example: E9}
          note: The book calls dic(15;15) (or psu dic) the more appropriate designation, since most arise from recombination between homologues; historically inv dup(15)(q12).
        - text: "47,XY,+dic(15;15)(pter→q12::q12→pter)"
          cite: {section: "9.2.4", page: 66, example: E9}
      invalid:
        - text: "45,XX,–13,–15,dic(13;15)(q22;q24)"
          why: The dicentric replaces one chromosome 13 and one chromosome 15; they are not written as missing.
          corrected: "45,XX,dic(13;15)(q22;q24)"
    fix: {level: 1, kind: delete, hint: Remove the losses of the chromosomes that the dicentric replaces.}
    review:
      paraphrase_checked: true
      needs_review: false
    related: [DIC.NO_DER_DIC, DIC.PSEUDODICENTRIC_ORDER, DER.DICENTRIC_FORMAT, KARYO.REPLACED_NORMAL_NOT_MISSING, ISO.FORMAT, DER.WHOLE_ARM_TWO_CHROMOSOMES, ROB.DICENTRIC_USE_DIC]

  - id: DIC.NO_DER_DIC
    title: Never der dic
    applies_to: [karyotype]
    severity: error
    statement: >-
      der may be used instead of dic for a dicentric chromosome, but the two must never be
      combined as der dic.
    cite:
      - {section: "9.2.4", page: 65, para: "¶1"}
    examples:
      valid: []
      invalid:
        - text: "45,XX,der dic(13;15)(q22;q24)"
          why: der and dic are alternatives; der dic is never used. Write dic(13;15) or der(13;15).
    review:
      paraphrase_checked: true
      needs_review: false
    related: [DIC.FORMAT]

  - id: DIC.PSEUDODICENTRIC_ORDER
    title: psu dic - active centromere first
    applies_to: [karyotype]
    severity: info
    statement: >-
      A pseudodicentric chromosome (two centromeres, only one active) is written psu dic
      (similarly psu idic, psu trc). The segment with the presumably active centromere, judged
      from the morphology in most cells, is always written first; if the active centromere can't
      be determined, the lowest chromosome number comes first. This overrides the usual
      lowest-number-first order.
    cite:
      - {section: "9.2.4", page: 66, para: "¶3"}
    examples:
      valid:
        - text: "45,XX,psu dic(15;13)(q12;q12)"
          cite: {section: "9.2.4", page: 66, example: E10}
          note: Chromosome 15 carries the active centromere, so it is written before 13.
        - text: "45,XX,psu dic(15;13)(15pter→15q12::13q12→13pter)"
          cite: {section: "9.2.4", page: 66, example: E10}
        - text: "46,XX,psu idic(20)(q11.2)"
          cite: {section: "9.2.4", page: 67, example: E11}
        - text: "46,XX,psu idic(20)(pter→q11.2::q11.2→pter)"
          cite: {section: "9.2.4", page: 67, example: E11}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        Which centromere is active can't be read from the string, so a validator must not flag
        psu dic(15;13) under STRUCT.CHROMOSOME_ORDER. The space in psu dic: SYM.SPACE_BETWEEN_SYMBOLS.
    related: [STRUCT.CHROMOSOME_ORDER, SYM.SPACE_BETWEEN_SYMBOLS, DIC.FORMAT]
