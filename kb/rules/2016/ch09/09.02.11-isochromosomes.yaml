version: "2016"
section: "9.2.11"
rules:
  - id: ISO.FORMAT
    title: i and idic - isochromosome breakpoints at p10 or q10
    applies_to: [karyotype]
    severity: error
    statement: >-
      An isochromosome is written i(chromosome)(breakpoint), never iso; an isodicentric
      chromosome is written idic(chromosome)(breakpoint). The breakpoint of an isochromosome is the
      centromeric band p10 or q10, chosen by the isochromosome's morphology. The shorter form
      i(17q) may be used in running text but not in a karyotype.
    cite:
      - {section: "9.2.11", page: 70, para: "¶1"}
      - {section: "9.2.11", page: 70, example: E1}
    examples:
      valid:
        - text: "46,XX,i(17)(q10)"
          cite: {section: "9.2.11", page: 70, example: E1}
        - text: "46,XX,i(17)(qter→q10::q10→qter)"
          cite: {section: "9.2.11", page: 70, example: E1}
        - text: "46,X,i(X)(q10)"
          cite: {section: "9.2.11", page: 70, example: E2}
        - text: "46,X,i(X)(qter→q10::q10→qter)"
          cite: {section: "9.2.11", page: 70, example: E2}
        - text: "47,XY,i(X)(q10)"
          cite: {section: "9.2.11", page: 70, example: E3}
          note: A normal X and Y plus the isochromosome; the i(X) is not written in the sex chromosome field.
        - text: "46,XX,idic(17)(p11.2)"
          cite: {section: "9.2.11", page: 70, example: E4}
        - text: "46,XX,idic(17)(qter→p11.2::p11.2→qter)"
          cite: {section: "9.2.11", page: 70, example: E4}
        - text: "46,XX,i(21)(q10)"
          cite: {section: "9.2.11", page: 70, example: E5}
          note: >-
            The i(21) replaces one chromosome 21; the normal 21 is not written with + although the
            long arm is present three times. §9.2.17.3 E4 gives the alternative der(21;21)/rob(21;21) form.
      invalid:
        - text: "46,XX,iso(17)(q10)"
          why: The symbol for an isochromosome is i, not iso.
          corrected: "46,XX,i(17)(q10)"
        - text: "46,XX,i(17q)"
          why: The short form i(17q) is for running text only; in a karyotype the breakpoint is given in parentheses.
          corrected: "46,XX,i(17)(q10)"
        - text: "46,XX,i(17)(q11.2)"
          why: The breakpoint of an isochromosome is assigned to the centromeric band p10 or q10.
          corrected: "46,XX,i(17)(q10)"
    fix: {level: 1, kind: replace, hint: "Write i(chromosome)(p10) or i(chromosome)(q10)."}
    review:
      paraphrase_checked: true
      needs_review: false
      note: Complex isochromosomes (isoderivatives) are derivatives - DER.ISODERIVATIVE (§9.2.11 ¶2).
    related: [DER.ISODERIVATIVE, DIC.FORMAT, BAND.CENTROMERE_10, KARYO.REPLACED_NORMAL_NOT_MISSING, ROB.FORMAT]
