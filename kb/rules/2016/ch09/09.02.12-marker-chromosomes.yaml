version: "2016"
section: "9.2.12"
rules:
  - id: MAR.PLUS_SIGN
    title: A marker chromosome is always preceded by +
    applies_to: [karyotype]
    severity: error
    statement: >-
      A marker chromosome (mar) is a structurally abnormal chromosome that conventional banding
      cannot identify. In a karyotype its presence is always written with a plus sign before mar.
      Several markers are counted before the symbol (+2mar), and a varying number as a range
      (+1~5mar).
    cite:
      - {section: "9.2.12", page: 70, para: "¶1"}
    examples:
      valid:
        - text: "47,XX,+mar"
          cite: {section: "9.2.12", page: 71, example: E1}
        - text: "47,XX,t(12;16)(q13;p11.2),+mar"
          cite: {section: "9.2.12", page: 71, example: E2}
        - text: "48,X,t(X;18)(p11.2;q11.2),+2mar"
          cite: {section: "9.2.12", page: 71, example: E3}
        - text: "47~51,XY,t(11;22)(q24;q12),+1~5mar[cp10]"
          cite: {section: "9.2.12", page: 71, example: E4}
      invalid:
        - text: "47,XX,mar"
          why: The marker chromosome is not preceded by a plus sign.
          corrected: "47,XX,+mar"
    fix: {level: 1, kind: insert, hint: Insert a plus sign before mar.}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        Placement at the end of the karyotype: ORDER.UNIDENTIFIED_LAST. A recognizable part makes it
        a der: DER.DEFINITION. Constitutional marker: MAR.CONSTITUTIONAL_C_SPACE.
    related: [ORDER.UNIDENTIFIED_LAST, DER.DEFINITION, MAR.NUMBERED, MAR.CONSTITUTIONAL_C_SPACE, KARYO.GAIN_LOSS_SIGN]

  - id: MAR.NO_SIZE_MORPHOLOGY
    title: No size or shape terms on markers
    applies_to: [karyotype]
    severity: warning
    statement: >-
      The karyotype does not describe the size or shape of a marker; terms such as min mar, A-size
      mar or acro mar are discouraged. Relevant details belong in the text.
    cite:
      - {section: "9.2.12", page: 70, para: "¶1"}
    examples:
      valid:
        - text: "47,XX,+mar"
          cite: {section: "9.2.12", page: 71, example: E1}
      invalid:
        - text: "47,XX,+min mar"
          why: The size of the marker (min) is not described in the karyotype.
          corrected: "47,XX,+mar"
        - text: "47,XX,+acro mar"
          why: The shape of the marker (acro) is not described in the karyotype.
          corrected: "47,XX,+mar"
    fix: {level: 1, kind: delete, hint: Remove the size or shape term and describe it in the text instead.}
    review:
      paraphrase_checked: true
      needs_review: false
      note: The book says "discouraged", hence warning (T-022).
    related: [MAR.PLUS_SIGN]

  - id: MAR.NUMBERED
    title: mar1, mar2 for different markers; mar1×2 for copies
    applies_to: [karyotype]
    severity: error
    statement: >-
      Different clonal markers may be numbered with an Arabic numeral after mar (mar1, mar2); the
      number does not mean the marker comes from that chromosome. Several copies of the same
      numbered marker are written with a multiplication sign after it (mar1×3 = three copies of
      marker 1).
    cite:
      - {section: "9.2.12", page: 71, para: "¶2"}
    examples:
      valid:
        - text: "48,XX,i(17)(q10),+mar1,+mar2[17]/51,XX,i(17)(q10),+mar1×3,+mar2,+mar3[13]"
          cite: {section: "9.2.12", page: 71, example: E5}
      invalid:
        - text: "51,XX,i(17)(q10),+mar1,+mar1,+mar1,+mar2,+mar3"
          why: Three copies of the same marker 1 are written once with a multiplication sign.
          corrected: "51,XX,i(17)(q10),+mar1×3,+mar2,+mar3"
        - text: "51,XX,i(17)(q10),+3mar1,+mar2,+mar3"
          why: Copies of a numbered marker take ×n after the symbol, not a number before it.
          corrected: "51,XX,i(17)(q10),+mar1×3,+mar2,+mar3"
    fix: {level: 1, kind: replace, hint: Write the copies of a numbered marker as marN×n.}
    review:
      paraphrase_checked: true
      needs_review: false
    related: [MAR.PLUS_SIGN, KARYO.MULTIPLY_SIGN_REARRANGED_ONLY, RING.UNIDENTIFIED]

  - id: DMIN.FORMAT
    title: dmin - number before the symbol, no +, not counted
    applies_to: [karyotype]
    severity: error
    statement: >-
      Double minutes (dmin), acentric structures, are recorded when present in more than one
      metaphase. The number per cell comes before the symbol, as an absolute number, an
      approximation or a range (1dmin, ~14dmin, 9~34dmin). dmin takes no plus sign, is not
      included in the chromosome count and is placed after any centric marker.
    cite:
      - {section: "9.2.12", page: 71, para: "¶4"}
    examples:
      valid:
        - text: "49,XX,…,+3mar,1dmin"
          cite: {section: "9.2.12", page: 71, example: E7}
          note: Partial string as printed; … stands for the omitted abnormalities.
        - text: "49,XY,…,+3mar,~14dmin"
          cite: {section: "9.2.12", page: 71, example: E8}
          note: Partial string as printed.
        - text: "49,XX,…,+3mar,9~34dmin"
          cite: {section: "9.2.12", page: 72, example: E9}
          note: Partial string as printed.
      invalid:
        - text: "49,XX,…,+3mar,+1dmin"
          why: Double minutes are not preceded by a plus sign.
          corrected: "49,XX,…,+3mar,1dmin"
        - text: "49,XX,…,+3mar,dmin14"
          why: The number of double minutes per cell is written before the symbol.
          corrected: "49,XX,…,+3mar,14dmin"
        - text: "49,XX,…,1dmin,+3mar"
          why: Double minutes are placed after any centric marker.
          corrected: "49,XX,…,+3mar,1dmin"
    fix: {level: 1, kind: replace, hint: "Write the number before dmin, drop the plus sign, and place it after the markers."}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        "More than one metaphase" and "not counted" are not checkable from the string alone (the
        count check is NUM.COUNT_MATCHES_CHANGES). Placement: ORDER.UNIDENTIFIED_LAST.
    related: [ORDER.UNIDENTIFIED_LAST, NUM.COUNT_MATCHES_CHANGES, ACE.NOT_IN_KARYOTYPE]

  - id: ACE.NOT_IN_KARYOTYPE
    title: Acentric fragments other than dmin are not in the karyotype
    applies_to: [karyotype]
    severity: error
    statement: >-
      Acentric fragments (ace) other than double minutes are not written in the karyotype, even
      when seen in more than one cell; they are recorded in chromosome breakage studies (chapter 10).
    cite:
      - {section: "9.2.12", page: 72, para: "¶5"}
    examples:
      valid: []
      invalid:
        - text: "46,XX,+ace"
          why: An acentric fragment is not presented in a karyotype.
          corrected: "46,XX"
    fix: {level: 1, kind: delete, hint: Remove the acentric fragment; record it in a breakage study instead.}
    review:
      paraphrase_checked: true
      needs_review: false
      note: ace in breakage studies is chapter 10 (T-018).
    related: [DMIN.FORMAT]
