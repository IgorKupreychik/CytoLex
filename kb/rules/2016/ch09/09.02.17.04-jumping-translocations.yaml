version: "2016"
section: "9.2.17.4"
rules:
  - id: TRANSLOC.JUMPING
    title: Jumping translocations - standard t, clones by decreasing frequency
    applies_to: [karyotype]
    context: [neoplastic]
    severity: error
    statement: >-
      Jumping translocations are written with the standard translocation nomenclature, one clone per
      translocation. The clones are listed like unrelated clones, in order of decreasing frequency
      (section 11.1.6).
    cite:
      - {section: "9.2.17.4", page: 79, para: "¶1"}
    examples:
      valid:
        - text: "46,XX,t(4;7)(q35;q11.2)[6]/46,XX,t(1;7)(p36.3;q11.2)[4]/46,XX,t(7;9)(q11.2;p24)[3]"
          cite: {section: "9.2.17.4", page: 79, example: E1}
      invalid:
        - text: "46,XX,t(1;7)(p36.3;q11.2)[4]/46,XX,t(4;7)(q35;q11.2)[6]/46,XX,t(7;9)(q11.2;p24)[3]"
          why: The clone with 6 cells must come before the clone with 4 cells (decreasing frequency).
          corrected: "46,XX,t(4;7)(q35;q11.2)[6]/46,XX,t(1;7)(p36.3;q11.2)[4]/46,XX,t(7;9)(q11.2;p24)[3]"
    fix: {level: 1, kind: reorder, hint: Order the clones by decreasing number of cells.}
    review:
      paraphrase_checked: true
      needs_review: false
      note: The general clone-order rule for unrelated clones is §11.1.6 (T-014); link it there.
    related: [TRANSLOC.FORMAT, KARYO.CLONE_SEPARATOR]
