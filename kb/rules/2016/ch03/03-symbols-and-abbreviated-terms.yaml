version: "2016"
section: "3"
rules:
  - id: SYM.LISTED_ONLY
    title: Only listed symbols and abbreviations
    applies_to: [general]
    severity: error
    statement: >-
      Chapter 3 lists every symbol and abbreviated term used to describe chromosomes and their
      abnormalities (vocabulary `symbols`, kb/vocab/2016/ch03/03-symbols.yaml). A symbol or
      abbreviation outside that list is not ISCN. Chromosome and band names, numbers, cell
      counts, probe and locus names and coordinates are not symbols.
    cite:
      - {section: "3", page: 34, para: "¶1"}
    examples:
      valid:
        - text: "46,XX,del(5)(q13q33)"
          note: Not a book example in this section.
      invalid:
        - text: "46,XX,dl(5)(q13q33)"
          why: "'dl' is not a listed abbreviation (deletion is del)."
          corrected: "46,XX,del(5)(q13q33)"
    fix: {level: 3, hint: "Replace the term with the listed symbol or abbreviation for what is meant."}
    review:
      paraphrase_checked: true
      needs_review: true
      note: >-
        Reading the list as closed is an inference from "All symbols … are listed below". Later
        chapters may use terms that are not in the list; check this while writing T-009 to T-019.
        Checked so far: ch. 4 (T-009) and ch. 5–7 (T-010), where every symbol used is listed
        (ch. 7 strings such as 13cenh+ or 14pstk+ are concatenations of listed symbols), and ch. 8
        (T-011): the ploidy levels n, 2n, 3n, 4n inside angle brackets (§8.1 ¶3, 58<2n>) are not
        listed; only the angle brackets are. §8.1 defines them, so the list is not strictly
        closed (see NUM.PLOIDY_IN_ANGLE_BRACKETS). Ch. 9.1–9.2.10 (T-012): every symbol used is
        listed (incl. ider, idic, psu, fis, hsr, Ph); the book itself rules out a symbol for
        abnormally banded regions (HSR.NO_ABR_SYMBOL), and Ph is listed but barred from
        karyotypes (DER.NO_PH_SYMBOL). Ch. 9.2.11–9.3 (T-013): every symbol used is listed (i,
        idic, mar, dmin, ace, neo, qdp, r, dic r, trc r, tas, t, rob, trc, trp, ×); jt is not used.
        "acro" (in "acro mar", which the book discourages, MAR.NO_SIZE_MORPHOLOGY) is not listed;
        "min" is. Ch. 11 (T-014): every symbol used is listed (idem, sl, sdl, cp, c, mat, ×, [ ],
        ~); the numbered forms sdl1, sdl2 and sl2 are the listed sl/sdl with a number (§11.1.4
        ¶1, E7), and the ploidy terms n±, 2n–, 2n+ (§11.2 ¶2) are report terms, not notation.
        Ch. 14 (T-017): every symbol used is listed (arr, GRCh, [ ], _, ×, ~, amp, mos, hmz, htz,
        mat, pat, inh, dn, c, cx, cth, or, qter, upd). Ch. 13.1–13.2 (T-015): every symbol used
        is listed (ish, wcp, amp, dim, enh, subtel, idic, ider, dmin, mos, mat, dn, ×, ~, /, or,
        +, –); the 5′/3′ prefixes of E35/E38 (5′CBFB) belong to the locus names, not the notation.

  - id: SYM.SPACE_BETWEEN_SYMBOLS
    title: Space between combined symbols
    applies_to: [general]
    severity: error
    statement: >-
      When two symbols or abbreviations are used together, they are separated by a space
      (psu dic).
    cite:
      - {section: "3", page: 34, para: "¶1"}
    examples:
      valid:
        - text: "psu dic"
          cite: {section: "3", page: 34, para: "¶1"}
      invalid:
        - text: "psudic"
          why: The two abbreviations psu and dic must be separated by a space.
          corrected: "psu dic"
    fix: {level: 1, kind: insert, hint: Insert a space between the two abbreviations.}
    review: {paraphrase_checked: true, needs_review: false}
    related: [SYM.NO_SPACE_AT_PARENTHESIS, SYM.NO_OTHER_SPACE]

  - id: SYM.SPACE_BEFORE_CHROMOSOME_COUNT
    title: Space between a symbol and the chromosome count
    applies_to: [general]
    severity: error
    statement: >-
      When a symbol or abbreviation comes before the total number of chromosomes and there is no
      parenthesis between them, a space separates the two (mos 47,XXX[25]/46,XX[5]).
    cite:
      - {section: "3", page: 34, para: "¶1"}
      - {section: "4.1", page: 38, para: "¶9"}
    examples:
      valid:
        - text: "mos 47,XXX[25]/46,XX[5]"
          cite: {section: "3", page: 34, para: "¶1"}
        - text: "mos 45,X/46,XX"
          cite: {section: "4.1", page: 38, para: "¶9"}
      invalid:
        - text: "mos47,XXX[25]/46,XX[5]"
          why: A space is required between mos and the chromosome number 47.
          corrected: "mos 47,XXX[25]/46,XX[5]"
    fix: {level: 1, kind: insert, hint: Insert a space between the abbreviation and the chromosome number.}
    review: {paraphrase_checked: true, needs_review: false}
    related: [SYM.NO_OTHER_SPACE]

  - id: SYM.NO_SPACE_AT_PARENTHESIS
    title: No space next to a parenthesis
    applies_to: [general]
    severity: error
    statement: >-
      No space is written between a symbol or abbreviation and a parenthesis that directly
      precedes or follows it.
    cite:
      - {section: "3", page: 34, para: "¶1"}
      - {section: "14.2", page: 116, para: "¶1"}
    examples:
      valid:
        - text: "46,XX,del(5)(q13q33)"
          note: Not a book example in this section.
      invalid:
        - text: "46,XX,del (5)(q13q33)"
          why: Space between del and the opening parenthesis.
          corrected: "46,XX,del(5)(q13q33)"
        - text: "arr (1–22,X)×2"
          why: No space is written between arr and the opening parenthesis (§14.2 ¶1).
          corrected: "arr(1–22,X)×2"
    fix: {level: 1, kind: delete, hint: Remove the space next to the parenthesis.}
    review: {paraphrase_checked: true, needs_review: false}
    related: [SYM.NO_OTHER_SPACE]

  - id: SYM.NO_OTHER_SPACE
    title: No space outside the prescribed places
    applies_to: [general]
    severity: error
    statement: >-
      A space is written only where a rule prescribes one: between symbols or abbreviations used
      together (psu dic, +mar dn, +mar c), after a symbol or abbreviation that precedes the number
      of chromosomes (mos 47,XXX), after the genome build of a microarray result, between a copy
      number and the inheritance or zygosity symbol after it, and around "or" between alternative
      interpretations. Nowhere else does a string contain a space: the number of chromosomes is
      followed directly by a comma, the sex chromosome constitution is written as one item, and the
      abnormalities are separated by commas alone.
    cite:
      - {section: "3", page: 34, para: "¶1"}
      - {section: "4.1", page: 37, para: "¶1"}
      - {section: "4.1", page: 37, para: "¶2"}
    examples:
      valid:
        - text: "46,XY"
          cite: {section: "4.1", page: 37, example: E1}
        - text: "mos 47,XY,+21/46,XY"
          cite: {section: "4.1", page: 38, para: "¶9"}
      invalid:
        - text: "47,XY, +21"
          why: A space after the comma that separates the abnormalities.
          corrected: "47,XY,+21"
        - text: "46,X Y,dup(1)(q21q32)"
          why: A space inside the sex chromosome constitution.
          corrected: "46,XY,dup(1)(q21q32)"
    fix: {level: 1, kind: delete, hint: Remove the space.}
    review:
      paraphrase_checked: false
      needs_review: false
      note: >-
        The book never states "no other spaces"; it names where a space is placed (§3 ¶1, §4.1 ¶9
        and ¶13, the build rule GEN.GENOME_BUILD_REQUIRED, ARR.INHERITANCE_SPACING, the "or" of
        §4.2/§5.3) and gives the printed format of §4.1 ¶1–2. The closed reading is taken from that
        format: all 720 valid KB examples (T-073 survey, 2026-11-20) put spaces only in those
        places. Severity error per the T-022 wording map (printed format) and its decision on
        non-canonical input. A spacing form added by a later section or edition needs its own rule
        and must be added to the list above.
    related: [SYM.SPACE_BETWEEN_SYMBOLS, SYM.SPACE_BEFORE_CHROMOSOME_COUNT, SYM.NO_SPACE_AT_PARENTHESIS, KARYO.DE_NOVO_SPACE, MAR.CONSTITUTIONAL_C_SPACE, ARR.INHERITANCE_SPACING, GEN.GENOME_BUILD_REQUIRED, BREAK.ALTERNATIVE_BANDS, BAND.DESIGNATION_FORMAT]

  - id: SYM.LETTER_CASE
    title: Symbols and sex chromosomes in the printed case
    applies_to: [general]
    severity: error
    statement: >-
      Symbols and abbreviations are written in the letter case of the chapter 3 list (del, t, mos,
      but Ph, GRCh, MI), and the sex chromosomes as the capital letters X and Y. A form that
      differs only in case is not the listed symbol.
    cite:
      - {section: "3", page: 34, para: "¶1"}
      - {section: "4.1", page: 37, para: "¶1"}
    examples:
      valid:
        - text: "46,XX"
          cite: {section: "4.1", page: 37, example: E1}
      invalid:
        - text: "46,xy"
          why: The sex chromosomes are the capital letters X and Y.
          corrected: "46,XY"
        - text: "46,XX,Del(5)(q13q33)"
          why: The deletion symbol is listed as lower-case del.
          corrected: "46,XX,del(5)(q13q33)"
    fix: {level: 1, kind: replace, hint: Write the symbol in its listed letter case.}
    review:
      paraphrase_checked: false
      needs_review: false
      note: >-
        The case follows the printed list (vocabulary symbols) and the printed sex chromosome
        constitution (§4.1 ¶1, E1); severity error per the T-022 decision on non-canonical input.
        A level-1 fix is given only when the form matches exactly one listed token ignoring case,
        or when its position decides between the two clashes (i isochromosome vs I meiosis
        numeral; x multiplication sign vs X sex chromosome: sex chromosome field → X/Y, symbol
        before "(" → i, multiplier position → SYM.TYPED_SYMBOL_FORMS). Otherwise SYM.LISTED_ONLY
        applies. Arm letters are BAND.ARM_SYMBOL.
    related: [SYM.LISTED_ONLY, SYM.TYPED_SYMBOL_FORMS, BAND.ARM_SYMBOL]

  - id: SYM.TYPED_SYMBOL_FORMS
    title: Typed forms of the arrow, minus and multiplication signs
    applies_to: [general]
    severity: error
    statement: >-
      The arrow may be written → or ->. The minus sign may be written – (as printed), - or −. The
      multiplication sign may be written × or, in multiplier position (after a closing
      parenthesis, a band or a closing square bracket, followed by a number), as a lowercase x.
      Each set is one symbol, so the typed forms get no diagnostic. An uppercase X in multiplier
      position is the sex chromosome letter, not the multiplication sign.
    cite:
      - {section: "3", page: 34, para: "¶2"}
      - {section: "3", page: 35, para: "¶3"}
      - {section: "4.3.2.1", page: 43, para: "¶1"}
    examples:
      valid:
        - text: "45,X,-X"
          cite: {section: "8.2", page: 55, example: E10}
          note: Hyphen-minus for the printed en dash.
        - text: "45,X,−X"
          cite: {section: "8.2", page: 55, example: E10}
          note: Minus sign U+2212 for the printed en dash.
        - text: "46,XX,del(6)(q13q23)x2"
          cite: {section: "9.3", page: 80, example: E1}
          note: Lowercase x for the printed multiplication sign.
        - text: "46,XX,del(5)(pter->q13::q33->qter)"
          cite: {section: "9.2.2", page: 60, example: E2}
          note: Typed arrow, which the book allows itself.
      invalid:
        - text: "46,XX,del(6)(q13q23)X2"
          why: Uppercase X is the sex chromosome, not the multiplication sign.
          corrected: "46,XX,del(6)(q13q23)×2"
    fix: {level: 1, kind: replace, hint: Replace the uppercase X with the multiplication sign.}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        The arrow forms are book text (§3 p.34, §4.3.2.1 ¶1). The minus and x equivalences are a
        project decision (T-053, docs/decisions.md), not book text.
    related: [SYM.LISTED_ONLY, SYM.LETTER_CASE]
