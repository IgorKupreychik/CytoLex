version: "2016"
section: "11.1.2"
rules:
  - id: CLONE.CELL_COUNT_REQUIRED
    title: Cell count in square brackets after every clone
    applies_to: [karyotype]
    context: [neoplastic]
    severity: error
    statement: >-
      The number of cells in a clone is given in square brackets after its karyotype. The count
      is given even when all cells are normal.
    cite:
      - {section: "11.1.2", page: 85, para: "¶1"}
    examples:
      valid:
        - text: "46,XX[20]"
          cite: {section: "11.1.2", page: 85, example: E1}
        - text: "46,XX,t(8;21)(q22;q22)[23]"
          cite: {section: "11.1.2", page: 85, example: E2}
      invalid:
        - text: "46,XY,t(8;21)(q22;q22)[26]/47,idem,+21"
          why: The subclone has no cell count in square brackets.
    fix: {level: 3, hint: "Give the number of cells in square brackets after each clone, e.g. [7]."}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        Context neoplastic (ch. 11); constitutional karyotypes write cell counts only where cell
        lines are given (section 4.1). The invalid example is inferred; its idem marks it as
        acquired. Fix level 3: the missing number is unknown.
    related: [KARYO.CLONE_SEPARATOR]

  - id: CLONE.ORDER_RELATED
    title: Related clones in order of increasing complexity
    applies_to: [karyotype]
    context: [neoplastic]
    severity: error
    statement: >-
      In cancer cytogenetics, related clones (the stemline and its subclones) are written in
      order of increasing complexity, whatever their size: the stemline, the most basic clone,
      comes first. When a tumour also has unrelated clones, the related clones come first and
      the unrelated ones follow (section 11.1.6).
    cite:
      - {section: "11.1.2", page: 85, para: "¶1"}
      - {section: "11.1.4", page: 86, para: "¶1"}
      - {section: "11.1.6", page: 89, para: "¶2"}
    examples:
      valid:
        - text: "46,XY,t(8;21)(q22;q22)[26]/47,XY,t(8;21)(q22;q22),+21[7]"
          cite: {section: "11.1.2", page: 85, example: E3}
        - text: "46,XY,t(8;21)(q22;q22)[26]/47,idem,+21[7]"
          cite: {section: "11.1.2", page: 85, example: E3}
        - text: "46,XY,t(8;21)(q22;q22)[26]/47,sl,+21[7]"
          cite: {section: "11.1.2", page: 85, example: E3}
        - text: "46,XX,t(8;21)(q22;q22)[12]/45,idem,–X[19]/46,idem,–X,+8[5]/47,idem,–X,+8,+9[8]"
          cite: {section: "11.1.4", page: 86, example: E2}
          note: The subclones follow increasing complexity, not size.
        - text: "50,XX,t(2;6)(p22;q16),…[19]/51,idem,+8[7]/52,idem,+8,+9[12]/46,XX,del(3)(q13)[11]/47,XX,+7[6]/46,XX,t(1;3)(p22;p14)[4]"
          cite: {section: "11.1.6", page: 89, example: E2}
      invalid:
        - text: "47,XY,t(8;21)(q22;q22),+21[7]/46,XY,t(8;21)(q22;q22)[26]"
          why: The subclone with the extra +21 is more complex than the clone with t(8;21) alone, so it comes second.
          corrected: "46,XY,t(8;21)(q22;q22)[26]/47,XY,t(8;21)(q22;q22),+21[7]"
    fix: {level: 1, kind: reorder, hint: Put the stemline first and the subclones in order of increasing complexity.}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        §11.1.4 ¶1 says "as far as possible"; §11.1.2 ¶1 states the order without that hedge, so
        the rule is an error where the relation is visible (a subclone holding all changes of
        another clone plus more). The invalid example is inferred (the reversed §11.1.2 E3).
    related: [CLONE.SUBCLONE_REFERENCE, CLONE.ORDER_UNRELATED, CLONE.NORMAL_LAST]

  - id: CLONE.IDEM_SL_NOT_MIXED
    title: idem and sl never mixed in one sample
    applies_to: [karyotype]
    context: [neoplastic]
    severity: error
    statement: >-
      Subclones can be described with idem or with sl (and sdl), but the two styles are never
      mixed in the description of a single tumour sample.
    cite:
      - {section: "11.1.2", page: 85, example: E3}
    examples:
      valid:
        - text: "46,XX,t(9;22)(q34;q11.2)[3]/47,sl,+8[17]/48,sdl1,+9[3]/49,sdl2,+11[12]"
          cite: {section: "11.1.4", page: 86, example: E1}
        - text: "46,XX,t(9;22)(q34;q11.2)[3]/47,idem,+8[17]/48,idem,+8,+9[3]/49,idem,+8,+9,+11[12]"
          cite: {section: "11.1.4", page: 86, example: E1}
      invalid:
        - text: "46,XX,t(9;22)(q34;q11.2)[3]/47,sl,+8[17]/48,idem,+8,+9[3]"
          why: sl and idem are both used in one sample.
    fix: {level: 3, hint: Use either idem or sl/sdl throughout the karyotype.}
    review:
      paraphrase_checked: true
      needs_review: false
      note: The rule is stated in the caption of §11.1.2 E3 ("must never be intermixed"). The invalid example is inferred.
    related: [CLONE.SUBCLONE_REFERENCE]
