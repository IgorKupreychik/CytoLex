version: "2016"
section: "11.1.5"
rules:
  - id: CP.FORMAT
    title: Composite karyotype - count range, clonal abnormalities, [cpN]
    applies_to: [karyotype]
    context: [neoplastic]
    severity: error
    statement: >-
      When subclones can't be described separately, a composite karyotype (cp) is made. It lists
      all clonally occurring abnormalities and gives the range of chromosome numbers in the
      cells that carry them. The total number of cells with the clonal changes follows the
      karyotype in square brackets, preceded by cp ([cp24]). The number of cells with each
      abnormality may be added in square brackets after that abnormality.
    cite:
      - {section: "11.1.5", page: 88, para: "¶1"}
      - {section: "11.1.5", page: 88, para: "¶2"}
    examples:
      valid:
        - text: "47~55,XX,del(3)(p12),+i(6)(p10),del(7)(q11.2),+8,dup(11)(q13q25),+16,+17,der(18)t(18;20)(q23;q11.1),+21,+21,+22[cp24]"
          cite: {section: "11.1.5", page: 88, example: E1}
          note: Printed over two lines; joined.
        - text: "45~48,XX,del(3)(p12)[2],–5[4],+8[2],+11[3][cp7]"
          cite: {section: "11.1.5", page: 88, example: E2}
          note: Cell counts after each abnormality; some cells have more than one of them.
        - text: "46,XY,t(9;22)(q34;q11.2)[5]/51~52,sl,+1,+5,–7,+8,+11,+13,+19,+der(22)t(9;22)[cp4]"
          cite: {section: "11.1.5", page: 89, example: E9}
        - text: "46,XY,t(9;22)(q34;q11.2)[5]/51~52,idem,+1,+5,–7,+8,+11,+13,+19,+der(22)t(9;22)[cp4]"
          cite: {section: "11.1.5", page: 89, example: E9}
          note: A stemline followed by a composite subclone.
      invalid:
        - text: "45~48,XX,del(3)(p12),–5,+8,+11[7cp]"
          why: cp comes before the cell count inside the square brackets.
          corrected: "45~48,XX,del(3)(p12),–5,+8,+11[cp7]"
    fix: {level: 1, kind: reorder, hint: "Write the total cell count of a composite karyotype as [cpN]."}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        Severity error: making a composite karyotype is a last resort ("will have to be
        created"), but its printed form is fixed. The range is a single number when every cell
        has the same count (E4). The invalid example is inferred.
    related: [CP.NOT_FOR_RANDOM_LOSS, CP.COUNT_AND_PARADOX, CLONE.MIN_CELLS, UNCERTAIN.APPROX_INTERVAL]

  - id: CP.NOT_FOR_RANDOM_LOSS
    title: cp not used for random loss
    applies_to: [karyotype]
    context: [neoplastic]
    severity: info
    statement: >-
      A composite karyotype is not used to describe random loss. Cells whose abnormalities are
      due to random loss are not part of the clone and are left out of the composite karyotype.
    cite:
      - {section: "11.1.5", page: 88, para: "¶1"}
      - {section: "11.1.5", page: 89, example: E7}
    examples:
      valid:
        - text: "43~46,XX,–7,+8[cp4]"
          cite: {section: "11.1.5", page: 89, example: E7}
          note: Built from the five cells of E6; the cell with 42 chromosomes and random losses is left out.
      invalid: []
    fix: {level: 3, hint: Leave cells with only random (nonclonal) losses out of the composite karyotype.}
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        Severity info: whether a loss is random can't be verified from the string (the single
        cells are not in it). A check reports cannotVerify only on a [cp…] karyotype.
    related: [CP.FORMAT, CLONE.MIN_CELLS]

  - id: CP.COUNT_AND_PARADOX
    title: cp count may differ from the sum of changes; gain and loss of one chromosome allowed
    applies_to: [karyotype]
    context: [neoplastic]
    severity: info
    statement: >-
      A composite karyotype does not show how many cells have each abnormality. The sum of the
      listed aberrations may therefore suggest a higher or lower chromosome number than the one
      actually seen, and a composite karyotype may contain gain and loss of the same chromosome.
    cite:
      - {section: "11.1.5", page: 88, para: "¶2"}
      - {section: "11.1.5", page: 88, para: "¶3"}
      - {section: "11.1.5", page: 88, para: "¶5"}
    examples:
      valid:
        - text: "48,XX,+7,+9,+11,+13[cp5]"
          cite: {section: "11.1.5", page: 88, example: E4}
          note: Every cell has 48 chromosomes, though the changes add up to 50.
        - text: "45~48,XX,+7,+12,+15,–15,del(17)(q11.1)[cp6]"
          cite: {section: "11.1.5", page: 89, example: E5}
          note: Trisomy 15 (two cells) and monosomy 15 (three cells) are both clonal.
        - text: "48,XX,+7,+9"
          cite: {section: "11.1.5", page: 88, example: E3}
          note: One of the single cells the E4 composite karyotype is built from.
        - text: "48,XX,+7,+11"
          cite: {section: "11.1.5", page: 88, example: E3}
        - text: "48,XX,+9,+11"
          cite: {section: "11.1.5", page: 88, example: E3}
        - text: "48,XX,+9,+13"
          cite: {section: "11.1.5", page: 88, example: E3}
        - text: "48,XX,+13,+21"
          cite: {section: "11.1.5", page: 88, example: E3}
        - text: "45,XX,–15,del(17)(q11.1)"
          cite: {section: "11.1.5", page: 88, para: "¶6"}
          note: The six single cells of E5 are printed inline in ¶6.
        - text: "46,XX,+7,–15,del(17)(q11.1)"
          cite: {section: "11.1.5", page: 88, para: "¶6"}
        - text: "46,XX,+12,–15"
          cite: {section: "11.1.5", page: 88, para: "¶6"}
        - text: "47,XX,+7"
          cite: {section: "11.1.5", page: 88, para: "¶6"}
        - text: "47,XX,+15,del(17)(q11.1)"
          cite: {section: "11.1.5", page: 88, para: "¶6"}
        - text: "48,XX,+12,+15"
          cite: {section: "11.1.5", page: 88, para: "¶6"}
        - text: "42,XX,–2,–16,–21,–22"
          cite: {section: "11.1.5", page: 89, example: E6}
          note: Single cells of E7; this one shows random loss and is left out of the composite.
        - text: "44,XX,–1,–7,+8,–11"
          cite: {section: "11.1.5", page: 89, example: E6}
        - text: "44,XX,–7,+8,–12,–13"
          cite: {section: "11.1.5", page: 89, example: E6}
        - text: "43,XX,–7,–18,–20"
          cite: {section: "11.1.5", page: 89, example: E6}
        - text: "46,XX,–7,+8"
          cite: {section: "11.1.5", page: 89, example: E6}
        - text: "51,XY,+1,–7,+8,t(9;22)(q34;q11.2),+11,+13,+19,+der(22)t(9;22)"
          cite: {section: "11.1.5", page: 89, example: E8}
          note: Single cells of E9.
        - text: "51,XY,+1,+5,–7,+8,t(9;22)(q34;q11.2),+11,+19,+der(22)t(9;22)"
          cite: {section: "11.1.5", page: 89, example: E8}
        - text: "51,XY,+1,+5,–7,+8,t(9;22)(q34;q11.2),+13,+19,+der(22)t(9;22)"
          cite: {section: "11.1.5", page: 89, example: E8}
        - text: "52,XY,+1,+5,–7,+8,t(9;22)(q34;q11.2),+11,+13,+19,+der(22)t(9;22)"
          cite: {section: "11.1.5", page: 89, example: E8}
        - text: "46,XY,t(9;22)(q34;q11.2)[5]"
          cite: {section: "11.1.5", page: 89, example: E8}
      invalid: []
    review:
      paraphrase_checked: true
      needs_review: false
      note: >-
        Severity info: an explanation that no string violates. It is the citation for skipping
        the count check (NUM.COUNT_MATCHES_CHANGES) and the gain/loss contradiction in a [cp…]
        karyotype (already skipped since T-030).
    related: [CP.FORMAT, NUM.COUNT_MATCHES_CHANGES]
